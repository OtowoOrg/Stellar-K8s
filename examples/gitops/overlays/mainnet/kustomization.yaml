apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Mainnet overlay — production environment.
# The corresponding ArgoCD Application is set to MANUAL sync only.
# A second approver is required on any PR that touches this overlay.
namespace: stellar-mainnet

resources:
  - ../../base

namePrefix: mainnet-

commonLabels:
  stellar.org/network: mainnet
  app.kubernetes.io/managed-by: argocd
  app.kubernetes.io/part-of: stellar-k8s

patches:
  - path: validator-patch.yaml
    target:
      kind: StellarNode
      name: validator
  - path: soroban-rpc-patch.yaml
    target:
      kind: StellarNode
      name: soroban-rpc
  - path: horizon-patch.yaml
    target:
      kind: StellarNode
      name: horizon
