---
# RBAC for the Stellar Operator
# Grants permissions to watch/manage StellarNode CRDs and related resources
{{- if .Values.watchNamespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "stellar-operator.fullname" . }}
  namespace: {{ .Values.watchNamespace }}
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "stellar-operator.fullname" . }}
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
{{- end }}
rules:
  # StellarNode CRD permissions
  - apiGroups: ["stellar.org"]
    resources: ["stellarnodes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["stellar.org"]
    resources: ["stellarnodes/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["stellar.org"]
    resources: ["stellarnodes/finalizers"]
    verbs: ["update"]

  # StellarBenchmark CRD permissions
  - apiGroups: ["stellar.org"]
    resources: ["stellarbenchmarks"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["stellar.org"]
    resources: ["stellarbenchmarks/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["stellar.org"]
    resources: ["stellarbenchmarks/finalizers"]
    verbs: ["update"]

  # Soroban contract deployment CRDs
  - apiGroups: ["stellar.org"]
    resources: ["contractwasms", "contractinstances"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["stellar.org"]
    resources: ["contractwasms/status", "contractinstances/status"]
    verbs: ["get", "update", "patch"]

  # BenchmarkReport CRD permissions
  - apiGroups: ["stellar.org"]
    resources: ["benchmarkreports"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["stellar.org"]
    resources: ["benchmarkreports/status"]
    verbs: ["get", "update", "patch"]

  # MaintenancePlan CRD — planned drain / prewarm / SLO orchestrator
  - apiGroups: ["stellar.org"]
    resources: ["maintenanceplans"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["stellar.org"]
    resources: ["maintenanceplans/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["stellar.org"]
    resources: ["maintenanceplans/finalizers"]
    verbs: ["update"]

  # PDB-aware drain (read disruption budgets; never mutate them)
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]

  # Core resources managed by the operator
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods/ephemeralcontainers"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # GitOps immutable secret injection (SKKS-022):
  # The operator only needs to read the SealedSecret/SOPS manifests and the controller-owned
  # keys it decrypts into tmpfs. It must NOT be able to list or get arbitrary secrets,
  # and it must never be able to write the decrypted validator keys back to the API server.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
    resourceNames:
      - {{ include "stellar-operator.fullname" . }}-gitops-source
      - {{ include "stellar-operator.fullname" . }}-gitops-age-key
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch", "delete"]
    resourceNames:
      - {{ include "stellar-operator.fullname" . }}-gitops-source
      - {{ include "stellar-operator.fullname" . }}-gitops-age-key

  # Workload resources
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # NetworkPolicy - operator creates per-node isolation policies.
  # Scoped to the watch namespace (or cluster-wide when watchNamespace is unset).
  # The operator NEVER reads NetworkPolicies from other namespaces.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # PodDisruptionBudgets - operator manages PDBs to protect validator eviction
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Events for status reporting
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

  # API authentication/authorization reviews (for REST API RBAC)
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]

  # Coordination for leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Spot/Preemptible drain: cordon nodes and evict pods on termination notice
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]

  # Bitnami SealedSecrets - operator reads the encrypted manifests from the GitOps
  # controller and decrypts them in-memory. We never grant write access to the decrypted
  # payload, only the controller-owned source objects.
  - apiGroups: ["bitnami.com"]
    resources: ["sealedsecrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["bitnami.com"]
    resources: ["sealedsecrets/status"]
    verbs: ["get", "update", "patch"]

  # Mozilla SOPS - operator reads the age-encrypted manifests from the GitOps
  # controller and decrypts them in-memory. The age key is mounted from a
  # kube-controller-owned Secret and is never written to disk.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
    resourceNames:
      - {{ include "stellar-operator.fullname" . }}-gitops-source

---
# Bind the Role to the ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.watchNamespace }}
kind: RoleBinding
metadata:
  name: {{ include "stellar-operator.fullname" . }}
  namespace: {{ .Values.watchNamespace }}
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "stellar-operator.fullname" . }}
{{- else }}
kind: ClusterRoleBinding
metadata:
  name: {{ include "stellar-operator.fullname" . }}
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "stellar-operator.fullname" . }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ include "stellar-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

---
# Namespace-reader ClusterRole -- grants the operator read-only access to
# Namespace objects so the network safety check (SKKS-021) can verify the
# stellar.org/network label on the namespace hosting a StellarNode.
#
# This is intentionally a separate, minimal ClusterRole so that teams running
# the operator with namespace-scoped RBAC (watchNamespace set) can grant
# only this narrow cluster-level permission without elevating the main Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "stellar-operator.fullname" . }}-namespace-reader
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "stellar-operator.fullname" . }}-namespace-reader
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "stellar-operator.fullname" . }}-namespace-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "stellar-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Node-reader ClusterRole — grants the operator read-only access to Node
# objects so the dynamic topology spread enforcer can inspect
# topology.kubernetes.io/zone labels and decide whether strict
# (hard) anti-affinity is achievable, falling back to soft/preferred
# constraints on single-zone or single-node clusters.
#
# This is intentionally a separate, minimal ClusterRole so that teams running
# the operator with namespace-scoped RBAC (watchNamespace set) can grant only
# this narrow cluster-level permission without elevating the main Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "stellar-operator.fullname" . }}-node-reader
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]

---
# Control-plane health ClusterRole (graceful degradation, #1494) — lets the
# operator probe etcd via the API server's /readyz/etcd check, read the
# scheduler leader lease, publish the cluster-scoped ControlPlaneHealth status
# and, in Permissive webhook mode, keep webhook failurePolicy at Ignore.
# Separate from the main role so it also works with watchNamespace set.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "stellar-operator.fullname" . }}-control-plane-health
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: ["/readyz", "/readyz/etcd"]
    verbs: ["get"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get"]
  - apiGroups: ["stellar.org"]
    resources: ["controlplanehealths"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["stellar.org"]
    resources: ["controlplanehealths/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
    verbs: ["get", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "stellar-operator.fullname" . }}-node-reader
  name: {{ include "stellar-operator.fullname" . }}-control-plane-health
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "stellar-operator.fullname" . }}-node-reader
  name: {{ include "stellar-operator.fullname" . }}-control-plane-health
subjects:
  - kind: ServiceAccount
    name: {{ include "stellar-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
