[package]
name = "p2p-firewall"
version = "0.1.0"
edition = "2021"
authors = ["Stellar K8s Contributors"]
description = "P2P Gossip Network Threat Detection Firewall for Stellar SCP port 11625"
license = "Apache-2.0"
repository = "https://github.com/stellar/stellar-k8s"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
regex = "1"
bytes = "1"
prometheus-client = "0.22"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
clap = { version = "4.5", features = ["derive"] }
async-trait = "0.1"

# Kubernetes client for NetworkPolicy management
kube = { version = "0.94", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.26", default-features = false, features = ["v1_30"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"

[[bin]]
name = "p2p-firewall"
path = "src/main.rs"

[lib]
name = "p2p_firewall"
path = "src/lib.rs"
