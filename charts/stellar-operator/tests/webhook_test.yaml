suite: webhook
templates:
  - templates/webhook.yaml
set:
  webhook.enabled: true

tests:
  - it: webhook Namespace is stellar-webhook
    documentIndex: 0
    asserts:
      - isKind:
          of: Namespace
      - equal:
          path: metadata.name
          value: stellar-webhook

  - it: webhook Deployment has 2 replicas for HA
    documentIndex: 4
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 2

  - it: webhook Deployment has liveness probe
    documentIndex: 4
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz

  - it: webhook Deployment has readiness probe
    documentIndex: 4
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /ready

  - it: webhook Deployment runs as non-root
    documentIndex: 4
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: webhook Service exposes port 443
    documentIndex: 5
    asserts:
      - isKind:
          of: Service
      - contains:
          path: spec.ports
          content:
            name: https
            port: 443
            targetPort: https
            protocol: TCP

  - it: ValidatingWebhookConfiguration targets stellarnodes
    documentIndex: 6
    asserts:
      - isKind:
          of: ValidatingWebhookConfiguration
      - equal:
          path: webhooks[0].rules[0].resources[0]
          value: stellarnodes

  - it: ValidatingWebhookConfiguration has failurePolicy Fail
    documentIndex: 6
    asserts:
      - equal:
          path: webhooks[0].failurePolicy
          value: Fail

  - it: permissive mode never blocks admission on webhook outage
    documentIndex: 6
    set:
      webhook.mode: permissive
    asserts:
      - equal:
          path: webhooks[0].failurePolicy
          value: Ignore

  - it: ValidatingWebhookConfiguration has sideEffects None
    documentIndex: 6
    asserts:
      - equal:
          path: webhooks[0].sideEffects
          value: None

  - it: PodDisruptionBudget ensures minAvailable 1
    documentIndex: 8
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1

  - it: webhook pod security context follows global podSecurityContext overrides
    documentIndex: 4
    set:
      podSecurityContext.runAsUser: 70000
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 70000
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: webhook container security context follows global securityContext overrides
    documentIndex: 4
    set:
      securityContext.readOnlyRootFilesystem: false
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false

  - it: cert-manager Certificate renders when webhook.certManager.enabled
    set:
      webhook.certManager.enabled: true
    documentIndex: 7
    asserts:
      - isKind:
          of: Certificate
      - equal:
          path: metadata.name
          value: stellar-webhook-cert

  - it: renders nothing when webhook.enabled is false
    set:
      webhook.enabled: false
    asserts:
      - hasDocuments:
          count: 0
