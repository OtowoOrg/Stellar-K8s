# Minimal StellarNode validator for quick start / CI smoke tests.
apiVersion: stellar.org/v1alpha1
kind: StellarNode
metadata:
  name: minimal-validator
  namespace: stellar
spec:
  nodeType: Validator
  network: testnet
  version: "v21.0.0"
  storage:
    storageClass: standard
    size: 50Gi
    retentionPolicy: Delete
  validatorConfig:
    seedSecretRef: validator-seed
    enableHistoryArchive: false
  gitopsSecrets:
    enabled: true
    provider: sops
    manifestPath: gitops/validator-seed.sops.yaml
    ageRecipientRef:
      name: validator-age-key
      key: age-recipient
    hardFailOnDecryptError: true
    tmpfs:
      enabled: true
      mountPath: /var/run/stellar/secrets
      sizeLimit: 64Mi
      readOnly: true
      noExec: true
    rbac:
      denySecretAccess: true
