name: API Contract Testing

on:
  push:
    branches: [main]
    paths:
      - 'docs/api/openapi.yaml'
      - 'src/rest_api/**'
      - 'tests/api_contract_tests.rs'
      - 'scripts/check-api-contract.py'
      - 'scripts/generate-openapi-spec.py'
  pull_request:
    branches: [main]
    paths:
      - 'docs/api/openapi.yaml'
      - 'src/rest_api/**'
      - 'tests/api_contract_tests.rs'
      - 'scripts/check-api-contract.py'
      - 'scripts/generate-openapi-spec.py'

concurrency:
  group: api-contract-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 1. OpenAPI Spec Validation ──────────────────────────────────────────────
  spec-validation:
    name: Validate OpenAPI Specification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate OpenAPI spec structure
        run: python3 scripts/generate-openapi-spec.py --spec docs/api/openapi.yaml

      - name: Check required routes are documented
        run: python3 scripts/generate-openapi-spec.py --spec docs/api/openapi.yaml --check

  # ── 2. Contract Validation ──────────────────────────────────────────────────
  contract-check:
    name: API Contract Validation
    runs-on: ubuntu-latest
    needs: [spec-validation]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate API contract (all endpoints documented)
        run: python3 scripts/check-api-contract.py check --spec docs/api/openapi.yaml

  # ── 3. Coverage Check ───────────────────────────────────────────────────────
  coverage:
    name: Endpoint Coverage (≥90%)
    runs-on: ubuntu-latest
    needs: [spec-validation]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check API endpoint coverage
        run: python3 scripts/check-api-contract.py coverage --spec docs/api/openapi.yaml --min-coverage 90

      - name: Coverage report (JSON)
        if: always()
        run: python3 scripts/check-api-contract.py coverage --spec docs/api/openapi.yaml --format json > /tmp/coverage-report.json || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-report
          path: /tmp/coverage-report.json
          retention-days: 30

  # ── 4. Breaking Change Detection ────────────────────────────────────────────
  breaking-changes:
    name: Breaking Change Detection
    runs-on: ubuntu-latest
    needs: [spec-validation]
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Detect breaking API changes
        run: |
          # Extract base branch spec
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git show "${{ github.event.pull_request.base.sha }}:docs/api/openapi.yaml" > /tmp/base-openapi.yaml 2>/dev/null || cp docs/api/openapi.yaml /tmp/base-openapi.yaml

          # Compare
          python3 scripts/check-api-contract.py breaking \
            --base /tmp/base-openapi.yaml \
            --head docs/api/openapi.yaml

  # ── 5. Rust Contract Tests ──────────────────────────────────────────────────
  rust-contract-tests:
    name: Rust Schema Validation Tests
    runs-on: ubuntu-latest
    needs: [spec-validation]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: "ci-api-contract"

      - name: Run API contract tests
        run: |
          cargo test --test api_contract_tests \
            --features "rest-api,metrics,k8s-v1-30" \
            -- --nocapture

  # ── 6. Summary ──────────────────────────────────────────────────────────────
  summary:
    name: Contract Testing Summary
    runs-on: ubuntu-latest
    # breaking-changes must be listed here too (issue #1366): `needs.<job>`
    # is only valid in expressions for jobs actually declared as a
    # dependency, and the step below already reads
    # `needs.breaking-changes.result` for the summary table row.
    needs:
      [
        spec-validation,
        contract-check,
        coverage,
        breaking-changes,
        rust-contract-tests,
      ]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## API Contract Testing Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| OpenAPI Spec Valid | ${{ needs.spec-validation.result == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Contract Validation | ${{ needs.contract-check.result == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Coverage ≥90% | ${{ needs.coverage.result == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Breaking Changes | ${{ needs.breaking-changes.result == 'success' && '✅ No breaking changes' || needs.breaking-changes.result == 'skipped' && '⏭️ Skipped (not PR)' || '❌ Breaking changes detected' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Rust Schema Tests | ${{ needs.rust-contract-tests.result == 'success' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "All documented endpoints are validated against the OpenAPI 3.0 specification." >> "$GITHUB_STEP_SUMMARY"
          echo "Response schemas are checked for required fields and correct types." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any check failed
        # issue #1366: `breaking-changes` only runs on pull_request (see its
        # own `if:`), so its result is legitimately 'skipped' on a push —
        # that must not fail the gate. A real 'failure' must.
        if: |
          needs.spec-validation.result != 'success' ||
          needs.contract-check.result != 'success' ||
          needs.coverage.result != 'success' ||
          needs.rust-contract-tests.result != 'success' ||
          needs.breaking-changes.result == 'failure'
        run: exit 1
