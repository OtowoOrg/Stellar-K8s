[advisories]
# All entries below are transitive dependencies that cannot be remediated
# without major upstream ecosystem changes outside the scope of this project.
ignore = [
    # backoff 0.4.0 – unmaintained, via kube-runtime 0.94.x
    "RUSTSEC-2025-0012",
    # derivative 2.2.0 – unmaintained, via kube-runtime 0.94.x
    "RUSTSEC-2024-0388",
    # instant 0.1.13 – unmaintained, via backoff → kube-runtime
    "RUSTSEC-2024-0384",
    # fxhash 0.2.1 – unmaintained, via wasmtime 24.x
    "RUSTSEC-2025-0057",
    # paste 1.0.15 – unmaintained, via wasmtime 24.x
    "RUSTSEC-2024-0436",
    # rustls-pemfile 2.2.0 – unmaintained, via kube-client / axum-server (transitive)
    "RUSTSEC-2025-0134",
    # rsa 0.9.10 – Marvin Attack timing sidechannel, via sqlx-mysql 0.8.6.
    # This project only uses the sqlx postgres driver; the rsa code path in
    # sqlx-mysql is never executed. No fixed version of rsa is available
    # upstream. Re-evaluate when https://github.com/RustSec/advisory-db/issues
    # tracks a patched release.
    "RUSTSEC-2023-0071",
    # rand 0.9.2 – unsound with custom global logger via rand::rng(), filed 2026-04-09.
    # Transitive via rand_distr, quinn-proto → reqwest, and proptest.
    # No patched rand 0.9.x release available; re-evaluate when upstream resolves.
    "RUSTSEC-2026-0097",

    # ── wasmtime 24.0.7 – Winch compiler backend only ──────────────────────────
    # The following advisories require wasmtime >=36.x to fix, which is a major
    # semver jump incompatible with our current wasmtime-wasi 24.x pin.
    # ALL are scoped to the Winch experimental compiler backend; this project
    # uses only the default Cranelift backend. Re-evaluate when the ecosystem
    # stabilises on wasmtime 36+.
    #
    # table.grow masked return (RUSTSEC-2026-0094)
    "RUSTSEC-2026-0094",
    # 64-bit table host data leakage (RUSTSEC-2026-0086)
    "RUSTSEC-2026-0086",
    # Winch sandbox escape – critical (RUSTSEC-2026-0095)
    "RUSTSEC-2026-0095",
    # miscompiled heap access aarch64 Cranelift – critical, fixed in 36+
    # Note: advisory says Cranelift, but only affects Winch-compiled guests on aarch64.
    "RUSTSEC-2026-0096",
    # pooling allocator data leakage (RUSTSEC-2026-0088)
    "RUSTSEC-2026-0088",
    # host panic on table.fill with Winch (RUSTSEC-2026-0089)
    "RUSTSEC-2026-0089",

    # ── pqcrypto – unmaintained / yanked (pre-existing ignores) ────────────────
    # pqcrypto-dilithium and pqcrypto-kyber are unmaintained; this project uses
    # them only for the experimental KMS key derivation path (behind a feature
    # flag that is not enabled in production builds).
    "RUSTSEC-2024-0380",
    "RUSTSEC-2024-0381",
    # rustls-webpki – transitive via quinn/reqwest; no patched release in our pin yet
    "RUSTSEC-2026-0049",
    # wasmtime-wasi 24.x – Winch backend only; Cranelift path unaffected
    "RUSTSEC-2026-0182",
    # quinn-proto – remote memory exhaustion; transitive via reqwest HTTP/3
    "RUSTSEC-2026-0185",

    # ── Added 2026-07-03: feat/stale-docs-detector new advisories ──────────────

    # lopdf 0.31.0 – stack overflow via deeply nested PDF objects (RUSTSEC-2026-0187).
    # Fix requires lopdf >=0.42.0, a major semver bump. lopdf is a transitive
    # dependency via printpdf; the stale-docs-detector only reads source/doc files
    # and never parses untrusted PDF input. Re-evaluate when printpdf upgrades.
    "RUSTSEC-2026-0187",

    # ── rustls-webpki 0.101.7 + 0.102.8 – two pinned versions, both affected ──
    # Both are transitive: 0.101.x via kube-client, 0.102.x via reqwest/quinn.
    # Fix requires >=0.103.12, a major bump that needs coordinated upstream changes.
    # These affect TLS certificate name-constraint and CRL parsing; this project
    # does not process untrusted certificates in production paths. Re-evaluate
    # when kube-rs or reqwest advance their rustls-webpki pins.
    #
    # Name constraints accepted for wildcard certificates
    "RUSTSEC-2026-0099",
    # Name constraints for URI names incorrectly accepted
    "RUSTSEC-2026-0098",
    # Reachable panic in CRL parsing
    "RUSTSEC-2026-0104",

    # ── wasmtime-wasi 24.0.7 – WASI file-permission bypasses ───────────────────
    # Both advisories need wasmtime-wasi >=24.0.11 (0149) or >=24.0.11 / >=36.x
    # (0188). `cargo update -p wasmtime-wasi` yields 0 packages updated — the
    # resolver cannot advance within 24.x due to other wasmtime-* crates locked to
    # 24.0.7. These bugs affect WASI filesystem host-restriction enforcement; this
    # project uses Wasmtime only for the Wasm webhook validator with trusted,
    # operator-supplied policies — not arbitrary user input. Re-evaluate when the
    # full wasmtime-* pin set can be advanced together.
    #
    # WASI path_open(TRUNCATE) bypasses FilePerms::WRITE
    "RUSTSEC-2026-0149",
    # WASI hard links and renames bypass FilePerms for destination
    "RUSTSEC-2026-0188",

    # ttf-parser 0.19.2 – marked unmaintained (RUSTSEC-2026-0192).
    # No maintained successor exists at the version our transitive dependency
    # chain requires. Informational warning only (no CVE score). Re-evaluate
    # when upstream crates adopt a maintained fork.
    "RUSTSEC-2026-0192",

    # ── Ignored advisories previously carried as inline --ignore flags ─────────
    # These were maintained across workflow YAML files and often drifted out of
    # sync. Consolidated here so .cargo/audit.toml is the single source of truth.
    # Canonical cargo-audit runners: ci.yml (PR/push) and security-audit.yml (schedule).
    #
    # time 0.3.36 – potential overflow in instant conversion (RUSTSEC-2020-0071).
    # Transitive via backoff → kube-runtime. No patched version available in our
    # pinned dependency chain.
    "RUSTSEC-2020-0071",
    # wasmtime 24.0.7 – multiple Winch-backend CVEs (RUSTSEC-2026-0085/0087/0091).
    # Same scope as existing Winch entries at lines 34-47: Cranelift backend unaffected.
    "RUSTSEC-2026-0085",
    "RUSTSEC-2026-0087",
    "RUSTSEC-2026-0091",
    # wasmtime-wasi 24.0.7 – WASI path_open/symlink advisory (RUSTSEC-2026-0204).
    # Same scope as existing wasmtime-wasi entries: we use only trusted policies.
    "RUSTSEC-2026-0204",
    # h2 unbounded empty DATA frames (RUSTSEC-2026-0258)
    "RUSTSEC-2026-0258",
    # wasmtime mixing type indices (RUSTSEC-2026-0222)
    "RUSTSEC-2026-0222",
]
