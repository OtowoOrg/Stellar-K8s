---
# SPDX-License-Identifier: Apache-2.0
# Stellar-K8s log-based alerting — PrometheusRule (Loki Ruler)
#
# These rules alert on patterns and anomalies detected in the structured JSON
# logs the operator emits (issue #1381). They are written in LogQL and are
# evaluated by a Loki Ruler; deploy them to the namespace of your Loki/Prometheus
# instance:
#
#   kubectl apply -f monitoring/log-alerts.yaml -n monitoring
#
# The rules assume logs are shipped to Loki by the chart's optional log shipper
# DaemonSet (charts/stellar-operator/templates/log-shipper.yaml, enabled via
# `logShipper.enabled`), or by any other aggregator that forwards the operator's
# JSON stdout logs and preserves namespace/pod labels.
#
# Prerequisites:
#   - Loki with the ruler enabled and recording/alerting HTTP endpoints reachable
#   - Structured JSON logs (enabled by default; see docs/structured-logging.md)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: stellar-operator-log-alerts
  namespace: stellar-system
  labels:
    app.kubernetes.io/name: stellar-operator
    app.kubernetes.io/component: log-alerts
spec:
  groups:
    - name: log.error-patterns
      interval: 60s
      rules:
        - alert: StellarLogErrorRateHigh
          # More than 200 ERROR-level structured log lines per namespace in a
          # rolling 5-minute window indicates a degraded pipeline.
          expr: |-
            max by (namespace) (
              count_over_time(
                {namespace=~"stellar-*"} | json | level="error" [5m]
              )
            ) > 200
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "High structured-log error rate in {{ $labels.namespace }}"
            description: >-
              More than 200 ERROR-level structured log lines were emitted across
              stellar-* namespaces in the last 5 minutes. Inspect the operator,
              sidecar, and watcher logs for recurring failures.
            runbook_url: "https://docs.stellar.org/runbooks/log-error-rate"

        - alert: StellarLogPanicDetected
          # A single panic/fatal structured log line warrants immediate triage.
          expr: |-
            count_over_time(
              {namespace=~"stellar-*"} | json | level=~"(panic|fatal)"
            ) > 0
          for: 1m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Panic/fatal log detected in {{ $labels.namespace }}"
            description: >-
              A panic or fatal-level structured log event was observed in the
              last minute. Check for crash-looping pods and recent operator
              releases.
            runbook_url: "https://docs.stellar.org/runbooks/panic-detected"

    - name: log.volume-anomalies
      interval: 60s
      rules:
        - alert: StellarLogVolumeAnomaly
          # Log volume more than 3x the same window one hour ago points to a
          # crash loop, noisy rule, or an attacker replaying traffic.
          expr: |-
            (
              sum by (namespace) (
                rate({namespace=~"stellar-*"}[5m])
              )
              /
              clamp_min(
                sum by (namespace) (
                  rate({namespace=~"stellar-*"}[5m] offset 1h)
                ),
                1
              )
            ) > 3
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Log volume anomaly in {{ $labels.namespace }}"
            description: >-
              Structured log volume in the last 5 minutes is more than 3 times
              the volume observed 1 hour ago. Investigate crash loops, retry
              storms, or recent configuration changes.

        - alert: StellarLogShipperDown
          # Fires when the per-node log shipper reports no pods ready for a
          # sustained window (requires the kube-state-metrics daemonset metric).
          expr: |-
            kube_daemonset_status_number_ready{
              daemonset=~".*-log-shipper"
            } == 0
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Log shipper DaemonSet has no ready pods"
            description: >-
              No ready log-shipper pods were observed for 10 minutes. Structured
              logs may not reach the central log store.