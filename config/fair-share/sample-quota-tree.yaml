# Example quota tree: 3 groups, 7 tenant leaves, 20 namespaces' worth of structure in miniature (#1959).
# Guarantees are protected from preemption; usage above them is elastic up to `max` and reclaimable.
apiVersion: stellar.org/v1alpha1
kind: TenantQuota
metadata: {name: platform}
spec:
  guaranteed: {cpu: "80", memory: 320Gi}
  max: {cpu: "140", memory: 560Gi}
---
apiVersion: stellar.org/v1alpha1
kind: TenantQuota
metadata: {name: platform-core}
spec:
  parent: platform
  namespaces: [core-validators, core-horizon]
  weight: 2
  guaranteed: {cpu: "30", memory: 120Gi}
  max: {cpu: "100", memory: 400Gi}
---
apiVersion: stellar.org/v1alpha1
kind: TenantQuota
metadata: {name: platform-apps}
spec:
  parent: platform
  namespaces: [apps]
  guaranteed: {cpu: "50", memory: 200Gi}
  max: {cpu: "80", memory: 320Gi}
---
apiVersion: stellar.org/v1alpha1
kind: TenantQuota
metadata: {name: partners}
spec:
  guaranteed: {cpu: "40", memory: 160Gi}
  max: {cpu: "100", memory: 400Gi}
---
apiVersion: stellar.org/v1alpha1
kind: TenantQuota
metadata: {name: partner-x}
spec:
  parent: partners
  namespaces: [partner-x]
  guaranteed: {cpu: "40", memory: 160Gi}
  max: {cpu: "70", memory: 280Gi}
