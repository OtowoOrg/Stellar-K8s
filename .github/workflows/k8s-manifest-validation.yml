name: Kubernetes Resource Validation

on:
  push:
    branches: [ main, release-* ]
    paths:
      - 'config/**'
      - 'charts/**'
      - 'examples/**'
      - 'bundle/**'
      - 'schemas/**'
      - 'scripts/validate-k8s-manifests.py'
      - '.github/workflows/k8s-manifest-validation.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'config/**'
      - 'charts/**'
      - 'examples/**'
      - 'bundle/**'
      - 'schemas/**'
      - 'scripts/validate-k8s-manifests.py'
      - '.github/workflows/k8s-manifest-validation.yml'

concurrency:
  group: k8s-manifest-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-manifests:
    name: Kubeconform & CRD Schema Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION="v0.6.4"
          wget -qO- "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: Check CRD JSON schema drift
        run: python3 scripts/ci/extract-crd-json-schemas.py --check

      - name: Validate Manifests and CRD Schemas
        run: python3 scripts/validate-k8s-manifests.py
