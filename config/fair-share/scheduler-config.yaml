# kube-scheduler configuration enabling the hierarchical fair-share extender (#1959).
#
# `nodeCacheCapable: true` keeps payloads small (node names only; the extender keeps its own view).
# `ignorable: true` = fail-open: if the extender is down, scheduling continues WITHOUT fair-share
# enforcement (ResourceQuota still applies). Set it to false to fail closed.
apiVersion: kubescheduler.config.k8s.io/v1
kind: KubeSchedulerConfiguration
extenders:
  - urlPrefix: "http://stellar-fairshare-extender.stellar-system.svc:8888"
    filterVerb: filter
    preemptVerb: preempt
    nodeCacheCapable: true
    httpTimeout: 5s
    ignorable: true
