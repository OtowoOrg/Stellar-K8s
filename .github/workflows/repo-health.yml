name: Repo Health

# Scheduled run of the full repository health gate (`make health` ->
# scripts/repo-health.sh). Failures fail the job; the complete log is
# uploaded as an artifact and summarised on the run page.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  repo-health:
    name: Repository Health Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        cache-key: "ci-repo-health"

    - name: Run make health
      run: |
        set -o pipefail
        make health 2>&1 | tee repo-health.log

    - name: Summarise result
      if: always()
      run: |
        {
          echo "## Repository health"
          echo ""
          echo "Full log: see the \`repo-health-log\` artifact."
          echo ""
          echo '```'
          tail -n 40 repo-health.log 2>/dev/null || echo "no log produced"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload health log
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: repo-health-log
        path: repo-health.log
        if-no-files-found: warn
        retention-days: 30
