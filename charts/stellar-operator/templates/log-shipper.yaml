{{- if .Values.logShipper.enabled }}
# Per-node log shipper DaemonSet (issue #1381).
# Tails CRI container logs on every node and forwards them to a central log
# store. DISABLED by default; the operator always emits structured JSON to
# stdout, so the forwarding layer is optional.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stellar-operator.fullname" . }}-log-shipper
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: log-shipper
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     {{ .Values.logShipper.logLevel | quote }}
        Parsers_File  parsers.conf

    [INPUT]
        Name          tail
        Tag           kube.*
        Path          /var/log/containers/*.log
        Parser        cri
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On

    [FILTER]
        Name          kubernetes
        Match         kube.*
        Merge_Log     {{ .Values.logShipper.jsonParsing | ternary "On" "Off" }}
        Keep_Log      Off
        K8s-Logging.Parser No

    {{- if .Values.logShipper.kubernetesFilter }}

    [FILTER]
        Name          modify
        Match         *
        Add           component log-shipper
    {{- end }}

    [OUTPUT]
    {{- if .Values.logShipper.loki.enabled }}
        Name          loki
        Match         *
        Host          {{ .Values.logShipper.loki.host | quote }}
        Port          {{ .Values.logShipper.loki.port }}
        Labels        component=log-shipper
    {{- if .Values.logShipper.loki.tenantId }}
        TenantID      {{ .Values.logShipper.loki.tenantId | quote }}
    {{- end }}
    {{- else if .Values.logShipper.elasticsearch.enabled }}
        Name          es
        Match         *
        Host          {{ .Values.logShipper.elasticsearch.host | quote }}
        Port          {{ .Values.logShipper.elasticsearch.port }}
        Index         {{ .Values.logShipper.elasticsearch.index | quote }}
        Replace_Dots  On
    {{- else }}
        Name          stdout
        Match         *
        Format        json_lines
    {{- end }}
  parsers.conf: |
    # CRI container runtime log format:
    #   2016-02-04T06:51:48.555555405Z stdout F This is a sample log output
    # Issue #1411 — the `cri` parser is required by the tail input above;
    # without it Fluent Bit fails to start ("lookup of parser 'cri' failed").
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<flags>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%LZ
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "stellar-operator.fullname" . }}-log-shipper
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: log-shipper
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "stellar-operator.fullname" . }}-log-shipper
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: log-shipper
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "stellar-operator.fullname" . }}-log-shipper
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: log-shipper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "stellar-operator.fullname" . }}-log-shipper
subjects:
  - kind: ServiceAccount
    name: {{ include "stellar-operator.fullname" . }}-log-shipper
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "stellar-operator.fullname" . }}-log-shipper
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: log-shipper
spec:
  selector:
    matchLabels:
      {{- include "stellar-operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: log-shipper
  template:
    metadata:
      labels:
        {{- include "stellar-operator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: log-shipper
    spec:
      serviceAccountName: {{ include "stellar-operator.fullname" . }}-log-shipper
      {{- with .Values.logShipper.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.logShipper.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.logShipper.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: fluent-bit
          image: "{{ .Values.logShipper.image.repository }}:{{ .Values.logShipper.image.tag }}"
          imagePullPolicy: {{ .Values.logShipper.image.pullPolicy }}
          resources:
            {{- toYaml .Values.logShipper.resources | nindent 12 }}
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
            - name: config
              mountPath: /fluent-bit/etc/parsers.conf
              subPath: parsers.conf
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: {{ include "stellar-operator.fullname" . }}-log-shipper
{{- end }}