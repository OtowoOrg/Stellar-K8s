[workspace]
resolver = "2"
members = ["upgrade_proxy"]

# This is a standalone Soroban workspace, intentionally kept out of the
# top-level Stellar-K8s Cargo workspace (which builds the Kubernetes
# operator binaries, not on-chain contracts).  Build it with the wasm32
# target via:
#
#   cd contracts/upgrade-proxy
#   cargo build --target wasm32-unknown-unknown --release -p upgrade-proxy

[profile.release]
opt-level      = "z"
overflow-checks = true
debug          = 0
debug-assertions = false
panic          = "abort"
codegen-units  = 1
lto            = true
