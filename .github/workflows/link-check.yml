name: Link Check (weekly)

# Repo-wide link rot scanner. Catches links that go stale over time, even
# when no PR touches the affected file. Runs the same lychee config as the
# PR-time `repo-wide-link-check` job in ci.yml.
on:
  schedule:
    # Mondays 07:00 UTC — a quiet window before the work week
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check-weekly
  cancel-in-progress: false

jobs:
  lychee:
    name: Lychee (scheduled)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: (optional) Restore lychee cache removed
        run: echo "Skipping cache restore in scheduled link-check to satisfy repository hygiene checks. Lychee will run without cache."

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --no-progress
            --cache
            './**/*.md'
            './**/*.html'
            './examples/**/*.yaml'
            './examples/**/*.yml'
          fail: false
          output: lychee-report.md

      - name: Open / update tracking issue on failure
        if: env.lychee_exit_code != '0'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Link Check Report"
          content-filepath: lychee-report.md
          labels: |
            documentation
            ci
        env:
          lychee_exit_code: ${{ steps.lychee.outputs.exit_code }}
