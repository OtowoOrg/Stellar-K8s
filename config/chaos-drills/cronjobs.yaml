apiVersion: batch/v1
kind: CronJob
metadata:
  name: chaos-drill-node-failure
  namespace: stellar-chaos
  labels:
    app: chaos-driller
    drill-type: node-failure
spec:
  schedule: "0 2 1 * *"  # 2 AM on 1st of every month
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 12
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: chaos-driller
            drill-type: node-failure
        spec:
          serviceAccountName: chaos-driller
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            fsGroup: 65532
          containers:
          - name: chaos-drill
            image: ghcr.io/stellar/stellar-k8s:0.1.0
            command: ["/scripts/run-chaos-drill.sh"]
            args: ["node-kill", "60", "validator"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            env:
            - name: NAMESPACE
              value: "stellar"
            - name: RESULTS_DIR
              value: "/results/chaos"
            volumeMounts:
            - name: results
              mountPath: /results
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi
          volumes:
          - name: results
            persistentVolumeClaim:
              claimName: chaos-results-pvc
---
