# ControlPlaneHealth (#1494): cluster-scoped singleton named "cluster".
# The operator creates it with these defaults if absent; apply this to switch
# the webhook layer to Permissive so an outage never blocks admission.
#
#   kubectl apply -f config/crd/controlplanehealth-crd.yaml
#   kubectl apply -f examples/control-plane-health.yaml
#   kubectl get controlplanehealth cluster
apiVersion: stellar.org/v1alpha1
kind: ControlPlaneHealth
metadata:
  name: cluster
spec:
  webhookMode: Permissive
  probeIntervalSeconds: 10
  probeTimeoutSeconds: 3
  failureThreshold: 3
  recoveryThreshold: 3
  dns:
    hostname: kubernetes.default.svc.cluster.local
  webhook:
    host: stellar-webhook.stellar-webhook.svc
    port: 443
    configurations:
      - kind: Validating
        name: stellar-webhook
  scheduler:
    leaseNamespace: kube-system
    leaseName: kube-scheduler
  incidentHistory: 10
