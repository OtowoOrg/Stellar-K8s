apiVersion: v1
kind: Service
metadata:
  name: {{ include "stellar-operator.fullname" . }}
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
  {{- with .Values.extraAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.restApiPort }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "stellar-operator.selectorLabels" . | nindent 4 }}
---
{{- $drain := .Values.draining | default dict }}
{{- $drainEnabled := $drain.enabled | default false }}
{{- $drainPort := $drain.port | default .Values.service.restApiPort }}
{{- $drainPath := $drain.path | default "/drain" }}
{{- $drainGrace := $drain.gracePeriodSeconds | default 30 }}
{{- $drainPreStopDelay := $drain.preStopDelaySeconds | default 5 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stellar-operator.fullname" . }}-drain
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
data:
  DRAINING_ENABLED: {{ $drainEnabled | quote }}
  DRAINING_PORT: {{ $drainPort | quote }}
  DRAINING_PATH: {{ $drainPath | quote }}
  DRAINING_GRACE_PERIOD_SECONDS: {{ $drainGrace | quote }}
  DRAINING_PRESTOP_DELAY_SECONDS: {{ $drainPreStopDelay | quote }}
  DRAINING_READINESS_PATH: {{ $drain.readinessPath | default "/readyz" | quote }}
  DRAINING_METRICS_ENABLED: {{ $drain.metricsEnabled | default true | quote }}
---
{{- if $drainEnabled }}
apiVersion: v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "stellar-operator.fullname" . }}
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
spec:
  minAvailable: {{ $drain.minAvailable | default 1 }}
  selector:
    matchLabels:
      {{- include "stellar-operator.selectorLabels" . | nindent 6 }}
{{- end }}