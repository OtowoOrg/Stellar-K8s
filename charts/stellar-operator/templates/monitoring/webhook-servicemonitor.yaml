{{- if and .Values.webhook.enabled .Values.webhook.certManager.enabled .Values.monitoring .Values.monitoring.enabled .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "stellar-operator.fullname" . }}-webhook
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - stellar-webhook
  selector:
    matchLabels:
      app.kubernetes.io/name: stellar-webhook
  endpoints:
    - port: cert-health
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
{{- end }}
