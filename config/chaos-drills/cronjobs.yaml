apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chaos-results-pvc
  namespace: stellar-chaos
  labels:
    app: chaos-driller
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
