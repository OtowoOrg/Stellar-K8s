# Blue-Green Deployment Manifests for Stellar Core (issue #1387)
#
# Implements zero-downtime validator upgrades by running two identical
# Stellar Core StatefulSets ("blue" and "green") and switching the Service
# selector only after the incoming deployment is fully synced.
#
# Phases:
#   1. BlueActive    – only blue StatefulSet running, Service → blue
#   2. PreparingGreen – green StatefulSet provisioned (validator=false, catches up)
#   3. WaitingForGreen – waiting for green to reach Synced state and ledger lag ≤ N
#   4. CuttingOver   – blue scaled to 0, Service selector switched to green
#   5. GreenActive   – only green running; blue retained for rollback window
#   6. RollingBack   – green failed; blue brought back up, Service switched back
#
# Automated rollback triggers:
#   - Green pod not Ready within readyTimeoutSeconds
#   - Green ledger lag > maxLedgerLag after reaching Synced
#   - Green fails consecutive health checks after cutover
#
# Usage:
#   # Apply the base manifests
#   kubectl apply -f config/blue-green/
#
#   # Trigger an upgrade by patching the target version annotation
#   kubectl annotate stellarnode my-validator \
#     stellar.org/bg-target-version=v22.0.0 \
#     stellar.org/bg-retry=true
#
#   # Monitor the rollout
#   kubectl get stellarnode my-validator -o jsonpath='{.status.blueGreenPhase}'
#
# See docs/operations/blue-green-upgrade.md for the full runbook.
---
# Blue StatefulSet – current (stable) version
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stellar-validator-blue
  namespace: stellar-system
  labels:
    app.kubernetes.io/name: stellar-validator
    app.kubernetes.io/component: validator
    stellar.org/deployment-color: blue
    stellar.org/bg-role: active
  annotations:
    stellar.org/bg-phase: BlueActive
    stellar.org/bg-active-color: blue
spec:
  serviceName: stellar-validator-blue
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stellar-validator
      stellar.org/deployment-color: blue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stellar-validator
        app.kubernetes.io/component: validator
        stellar.org/deployment-color: blue
        stellar.org/bg-role: active
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: stellar-core
          image: stellar/stellar-core:v21.0.0
          env:
            - name: NODE_IS_VALIDATOR
              value: "true"
          ports:
            - name: peer
              containerPort: 11625
            - name: http
              containerPort: 11626
          readinessProbe:
            httpGet:
              path: /info
              port: 11626
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /info
              port: 11626
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/stellar
      volumes:
        - name: config
          configMap:
            name: stellar-validator-blue-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
---
# Green StatefulSet – incoming (new) version, validator=false until cutover
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stellar-validator-green
  namespace: stellar-system
  labels:
    app.kubernetes.io/name: stellar-validator
    app.kubernetes.io/component: validator
    stellar.org/deployment-color: green
    stellar.org/bg-role: standby
  annotations:
    stellar.org/bg-phase: PreparingGreen
spec:
  serviceName: stellar-validator-green
  # Green starts at 0; operator scales to 1 when rollout begins
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: stellar-validator
      stellar.org/deployment-color: green
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stellar-validator
        app.kubernetes.io/component: validator
        stellar.org/deployment-color: green
        stellar.org/bg-role: standby
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: stellar-core
          image: stellar/stellar-core:v22.0.0   # new version
          env:
            # Warms as a watcher (not a validator) until cutover
            - name: NODE_IS_VALIDATOR
              value: "false"
          ports:
            - name: peer
              containerPort: 11625
            - name: http
              containerPort: 11626
          readinessProbe:
            httpGet:
              path: /info
              port: 11626
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /info
              port: 11626
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/stellar
      volumes:
        - name: config
          configMap:
            name: stellar-validator-green-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
---
# Active-slot Service — selector switches between blue / green
apiVersion: v1
kind: Service
metadata:
  name: stellar-validator
  namespace: stellar-system
  labels:
    app.kubernetes.io/name: stellar-validator
    app.kubernetes.io/component: validator
  annotations:
    stellar.org/bg-active-color: blue   # operator flips this at cutover
spec:
  type: ClusterIP
  # Selector matches the currently-active color; operator patches this field
  selector:
    app.kubernetes.io/name: stellar-validator
    stellar.org/deployment-color: blue   # → "green" after cutover
  ports:
    - name: peer
      port: 11625
      targetPort: peer
    - name: http
      port: 11626
      targetPort: http
---
# Blue-specific headless service (peer connectivity during cutover)
apiVersion: v1
kind: Service
metadata:
  name: stellar-validator-blue
  namespace: stellar-system
  labels:
    app.kubernetes.io/name: stellar-validator
    stellar.org/deployment-color: blue
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: stellar-validator
    stellar.org/deployment-color: blue
  ports:
    - name: peer
      port: 11625
    - name: http
      port: 11626
---
# Green-specific headless service
apiVersion: v1
kind: Service
metadata:
  name: stellar-validator-green
  namespace: stellar-system
  labels:
    app.kubernetes.io/name: stellar-validator
    stellar.org/deployment-color: green
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: stellar-validator
    stellar.org/deployment-color: green
  ports:
    - name: peer
      port: 11625
    - name: http
      port: 11626
---
# PodDisruptionBudget to protect the active slot during Kubernetes maintenance
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stellar-validator-active
  namespace: stellar-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stellar-validator
      stellar.org/bg-role: active
