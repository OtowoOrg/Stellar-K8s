name: Dependency Contract Gate

# Blocks dependency upgrades that break an in-repo consumer (#1999).
#
# For every direct dependency whose locked version changed in the PR, the
# `dependency-upgrade-gate` binary scans src/, tests/ and benches/ for call
# sites, generates consumer contract tests from them, checks the upgrade against
# config/dependency-breaking-changes.json and fails the job when it is
# incompatible. The failure names the consumers and file:line call sites
# responsible. Approved upgrades upload a signed validation artifact.
#
# Make this job a required status check on `main` so a blocked upgrade cannot
# merge.

on:
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "config/dependency-breaking-changes.json"
      - "scripts/dependency-upgrades.py"
      - "src/dependency_contract.rs"
      - "src/dependency_scan.rs"
      - "src/bin/dependency-upgrade-gate.rs"
      - ".github/workflows/dependency-contract-gate.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-contract-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Validate dependency upgrades
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: "dependency-contract-gate"

      - name: Build the gate
        run: cargo build --locked --bin dependency-upgrade-gate

      - name: Find upgraded dependencies
        id: detect
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          python3 scripts/dependency-upgrades.py "origin/${BASE_REF}" > upgrades.txt
          echo "Upgraded direct dependencies:"
          cat upgrades.txt || true
          echo "count=$(grep -c . upgrades.txt || true)" >> "$GITHUB_OUTPUT"

      - name: Run the gate for each upgrade
        id: gate
        if: steps.detect.outputs.count != '0'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
        run: |
          set -uo pipefail
          mkdir -p gate-reports
          blocked=0
          while read -r name from to; do
            [ -z "${name}" ] && continue
            ./target/debug/dependency-upgrade-gate \
              --dependency "${name}" --from "${from}" --to "${to}" \
              --pr "${PR_NUMBER}" \
              --breaking-changes config/dependency-breaking-changes.json \
              --json-out "gate-reports/${name}.json" \
              --markdown-out "gate-reports/${name}.md" \
              --tests-out "gate-reports/${name}-contract-tests.rs"
            rc=$?
            if [ "${rc}" -eq 1 ]; then
              blocked=1
            elif [ "${rc}" -ne 0 ]; then
              echo "::error::dependency-upgrade-gate could not run for ${name} (exit ${rc})"
              exit 2
            fi
          done < upgrades.txt
          echo "blocked=${blocked}" >> "$GITHUB_OUTPUT"

      - name: Publish the summary
        if: always() && steps.detect.outputs.count != '0'
        run: |
          set -euo pipefail
          {
            echo "## Dependency upgrade gate"
            for report in gate-reports/*.md; do
              [ -e "${report}" ] || continue
              cat "${report}"
              echo
            done
          } | tee gate-reports/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports and generated contract tests
        if: always() && steps.detect.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-contract-gate
          path: gate-reports/
          if-no-files-found: ignore

      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.detect.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'gate-reports/summary.md';
            if (!fs.existsSync(path)) return;
            const marker = '<!-- dependency-contract-gate -->';
            const body = `${marker}\n${fs.readFileSync(path, 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail when an upgrade is blocked
        if: steps.gate.outputs.blocked == '1'
        run: |
          echo "::error::A dependency upgrade breaks an in-repo consumer. See the job summary for the consumers and call sites."
          exit 1
