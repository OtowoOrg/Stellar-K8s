    - Production Profiling Runbook: operations/profiling-runbook.md
    - Core Blue/Green Runbook: operations/core-blue-green-runbook.md
    - OpenTelemetry Tracing: observability/tracing.md
    - Distributed Rate Limiting: distributed-rate-limiting.md
    - Feature Flag Rollouts: feature-flag-rollouts.md
  - Troubleshooting:
    - troubleshooting/index.md
    - Common Issues: troubleshooting/common-issues.md
    - Networking: troubleshooting/networking.md
    - Diagnostic Decision Trees: troubleshooting/diagnostic-decision-trees.md
    - Operator Runbooks: troubleshooting/operator-runbooks.md
    - Metrics and Alerting: troubleshooting/metrics-alerting.md
  - API Reference:
