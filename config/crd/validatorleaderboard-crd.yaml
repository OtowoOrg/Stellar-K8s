apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: validatorleaderboards.stellar.org
spec:
  group: stellar.org
  names:
    kind: ValidatorLeaderboard
    plural: validatorleaderboards
    singular: validatorleaderboard
    shortNames:
      - vboard
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: TotalValidators
          type: integer
          jsonPath: .status.totalValidators
        - name: MedianScore
          type: number
          jsonPath: .status.medianScore
        - name: NetworkHealth
          type: number
          jsonPath: .status.networkHealthIndex
        - name: LastRefreshed
          type: date
          jsonPath: .status.lastAggregatedAt
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                federationRef:
                  type: string
                refreshIntervalSeconds:
                  type: integer
                  default: 3600
                topN:
                  type: integer
                  default: 100
            status:
              type: object
              properties:
                lastAggregatedAt:
                  type: string
                  format: date-time
                totalValidators:
                  type: integer
                medianScore:
                  type: number
                networkHealthIndex:
                  type: number
                entries:
                  type: array
                  items:
                    type: object
                    properties:
                      rank:
                        type: integer
                      validatorName:
                        type: string
                      namespace:
                        type: string
                      compositeScore:
                        type: number
                      grade:
                        type: string
                      uptimePct:
                        type: number
                      consensusRate:
                        type: number
                      archiveCompletenessPct:
                        type: number
                      region:
                        type: string
