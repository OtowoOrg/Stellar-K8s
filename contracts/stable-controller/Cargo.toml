[package]
name = "stable-controller"
version = "0.1.0"
edition = "2021"
description = "Algorithmic stablecoin seigniorage controller for Soroban"
license = "Apache-2.0"

[library]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { version = "21.0.0", features = ["alloc"] }
sorban-token = { version = "21.0.0" }
serde = { version = "1.0.200", features = ["derive"] }

[depdevice-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
debug = false
