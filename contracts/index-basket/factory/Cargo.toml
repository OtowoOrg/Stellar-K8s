[package]
name = "index-basket-factory"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Factory that deploys and registers index-basket contracts"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
