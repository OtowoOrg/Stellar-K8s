# Chaos Experiment 14 — Cluster DNS Outage, 15 min (issue #1494)
#
# Part of the control-plane component-kill matrix (etcd, DNS, webhook,
# scheduler), each isolated for 15 minutes with workload traffic held flat.
#
# Scenario: every CoreDNS pod fails for 15 minutes.
#
# Success criteria:
#   1. ControlPlaneHealth/cluster reaches level Degraded within 30s
#   2. Webhook component stays Healthy (probe uses its cached address)
#   3. No StellarNode pod is restarted by the operator during the outage
#   4. Workload traffic (held flat) sees no errors on existing connections
#   5. Level returns to Normal without intervention; status.incidents[0]
#      reports components [Dns] and peakLevel Degraded
#
# SLO: automatic recovery within 60s of DNS returning
# Severity: 🔴 Critical
# Category: control-plane
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: control-plane-dns-outage
  namespace: chaos-testing
  labels:
    chaos.stellar.org/experiment: "14"
    chaos.stellar.org/category: control-plane
    chaos.stellar.org/severity: critical
spec:
  action: pod-failure
  mode: all
  selector:
    namespaces:
      - kube-system
    labelSelectors:
      k8s-app: kube-dns
  duration: "15m"
