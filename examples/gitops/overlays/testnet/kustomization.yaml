apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Testnet overlay — points at the shared base and applies testnet-specific patches.
# Render: kubectl kustomize examples/gitops/overlays/testnet
namespace: stellar-testnet

resources:
  - ../../base

# Prefix all resource names with the environment to avoid cross-namespace collisions.
namePrefix: testnet-

commonLabels:
  stellar.org/network: testnet
  app.kubernetes.io/managed-by: argocd
  app.kubernetes.io/part-of: stellar-k8s

patches:
  - path: validator-patch.yaml
    target:
      kind: StellarNode
      name: validator
  - path: soroban-rpc-patch.yaml
    target:
      kind: StellarNode
      name: soroban-rpc
  - path: horizon-patch.yaml
    target:
      kind: StellarNode
      name: horizon
