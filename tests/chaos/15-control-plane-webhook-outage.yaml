# Chaos Experiment 15 — Admission Webhook Outage, 15 min (issue #1494)
#
# Part of the control-plane component-kill matrix (etcd, DNS, webhook,
# scheduler), each isolated for 15 minutes with workload traffic held flat.
#
# Scenario: every stellar-webhook pod fails for 15 minutes while
# ControlPlaneHealth/cluster has webhookMode: Permissive.
#
# Success criteria:
#   1. ControlPlaneHealth/cluster reaches level Reduced within 30s
#   2. Pods keep starting: the webhook failurePolicy stays Ignore
#   3. No StellarNode pod is restarted by the operator during the outage
#   4. Level returns to Normal without intervention; status.incidents[0]
#      reports components [Webhook] and peakLevel Reduced
#
# SLO: automatic recovery within 60s of the webhook returning
# Severity: 🟠 High
# Category: control-plane
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: control-plane-webhook-outage
  namespace: chaos-testing
  labels:
    chaos.stellar.org/experiment: "15"
    chaos.stellar.org/category: control-plane
    chaos.stellar.org/severity: high
spec:
  action: pod-failure
  mode: all
  selector:
    namespaces:
      - stellar-webhook
    labelSelectors:
      app.kubernetes.io/name: stellar-webhook
  duration: "15m"
