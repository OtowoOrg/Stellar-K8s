[package]
name = "ephemeral-oracle"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Temporary Storage Oracle for Ephemeral Price Feeds — writes signed price data exclusively to Soroban Temporary Storage with aggressive TTL to achieve zero long-term state growth"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "27.0.6", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils", "alloc"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[workspace]
