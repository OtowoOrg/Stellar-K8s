# Validated PromQL alert conditions — Issue #89
#
# These five PrometheusRule manifests were generated by the Visual PromQL
# Alert Builder UI (frontend/builder/alerts/) and validated with:
#
#   promtool check rules <file>
#
# Each manifest matches the PrometheusRule CRD schema used in
# monitoring/fork-detector-alerts.yaml and passes the yamlExporter unit
# tests in yamlExporter.test.js.
#
# ─────────────────────────────────────────────────────────────────────────────
# Condition 1 – Fork detected: diverging ledgers + low anchor response
# ─────────────────────────────────────────────────────────────────────────────

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: stellar-custom-forkdetected
  namespace: monitoring
  labels:
    app: stellar-operator
    release: kube-prometheus-stack
spec:
  groups:
    - name: stellar.custom.alerts
      rules:
        - alert: StellarForkDetected
          expr: |
            stellar_fork_detector_consecutive_diverging_ledgers >= 3
            and
            stellar_fork_detector_responding_anchors < 8
          for: 5m
          labels:
            severity: critical
            team: stellar-infra
            component: fork-detector
          annotations:
            summary: "Potential network fork detected"
            description: |
              The node has diverged from the anchor majority for 5 minutes.
              Diverging ledgers: {{ $value }}. Check stellar-core logs and
              quorum-set configuration immediately.

# ─────────────────────────────────────────────────────────────────────────────
# Condition 2 – Low sync confidence
# ─────────────────────────────────────────────────────────────────────────────

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: stellar-custom-lowsyncconfidence
  namespace: monitoring
  labels:
    app: stellar-operator
    release: kube-prometheus-stack
spec:
  groups:
    - name: stellar.custom.alerts
      rules:
        - alert: StellarLowSyncConfidence
          expr: |
            stellar_fork_detector_sync_confidence < 500
          for: 2m
          labels:
            severity: warning
            team: stellar-infra
            component: fork-detector
          annotations:
            summary: "Stellar sync confidence below 50%"
            description: |
              Sync confidence is {{ $value }} permille (threshold: 500).
              The node may be partitioned or catching up after a restart.

# ─────────────────────────────────────────────────────────────────────────────
# Condition 3 – Watcher poll errors spiking (counter increase over 1h)
# ─────────────────────────────────────────────────────────────────────────────

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: stellar-custom-watcherpollerrors
  namespace: monitoring
  labels:
    app: stellar-operator
    release: kube-prometheus-stack
spec:
  groups:
    - name: stellar.custom.alerts
      rules:
        - alert: StellarWatcherPollErrorRate
          expr: |
            increase(stellar_watcher_poll_errors_total[1h]) > 5
          for: 0m
          labels:
            severity: warning
            team: stellar-infra
            component: watcher
          annotations:
            summary: "Stellar watcher poll error rate elevated"
            description: |
              More than 5 watcher poll errors in the last hour
              (increase = {{ $value }}). Check watcher connectivity and
              Horizon endpoint health.

# ─────────────────────────────────────────────────────────────────────────────
# Condition 4 – No anchor nodes responding (complete anchor loss)
# ─────────────────────────────────────────────────────────────────────────────

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: stellar-custom-noanchorsresponding
  namespace: monitoring
  labels:
    app: stellar-operator
    release: kube-prometheus-stack
spec:
  groups:
    - name: stellar.custom.alerts
      rules:
        - alert: StellarNoAnchorsResponding
          expr: |
            stellar_fork_detector_responding_anchors == 0
          for: 1m
          labels:
            severity: critical
            team: stellar-infra
            component: fork-detector
          annotations:
            summary: "Zero anchor nodes responding to fork detector"
            description: |
              No anchor nodes are responding. The fork detector cannot
              validate ledger consensus. Verify network connectivity and
              anchor node health.

# ─────────────────────────────────────────────────────────────────────────────
# Condition 5 – Critical CVE alert spike (security posture)
# ─────────────────────────────────────────────────────────────────────────────

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: stellar-custom-cvecriticalalerts
  namespace: monitoring
  labels:
    app: stellar-operator
    release: kube-prometheus-stack
spec:
  groups:
    - name: stellar.custom.alerts
      rules:
        - alert: StellarCriticalCveAlerts
          expr: |
            increase(stellar_cve_critical_alerts_total[24h]) > 0
          for: 0m
          labels:
            severity: critical
            team: stellar-infra
            component: security
          annotations:
            summary: "New critical CVE alerts detected in Stellar-K8s"
            description: |
              {{ $value }} new critical CVE alert(s) detected in the last 24h.
              Review the CVE dashboard and apply patches immediately.
