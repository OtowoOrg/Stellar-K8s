name: Performance & Benchmark Pipeline

# Unified performance pipeline.
# Runs benchmark suites in a matrix and publishes a single summary report.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "benches/**"
      - "charts/**"
      - "benchmarks/**"
      - "scripts/bench-helm-render.sh"
      - "scripts/collect-criterion-results.py"
      - ".github/workflows/performance.yml"
      - ".github/actions/setup-perf-env/**"
      - ".github/actions/compare-benchmarks/**"
  workflow_dispatch:
    inputs:
      suite:
        description: "Benchmark suite to run (all, operator, regression, webhook, criterion, helm)"
        required: false
        default: all
      baseline_version:
        description: Baseline version to compare
        required: false
        default: latest
      regression_threshold:
        description: Regression threshold %
        required: false
        default: "10"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  K6_VERSION: "0.54.0"

jobs:
  resolve-matrix:
    name: Resolve Benchmark Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.matrix.outputs.suites }}
    steps:
      - id: matrix
        shell: bash
        run: |
          SUITE="${{ github.event.inputs.suite || 'all' }}"
          case "$SUITE" in
            operator) SUITES='["operator"]' ;;
            regression) SUITES='["regression"]' ;;
            webhook) SUITES='["webhook"]' ;;
            criterion) SUITES='["criterion"]' ;;
            helm) SUITES='["helm"]' ;;
            *) SUITES='["operator","regression","webhook","criterion","helm"]' ;;
          esac
          echo "suites=$SUITES" >> "$GITHUB_OUTPUT"

  build:
    name: Build Operator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # Shared build-operator composite action consolidates Rust + Docker
      # bootstrap that was previously duplicated across workflows (issue #1136).
      # upload-artifact: "true" exports operator-image.tar.gz as an artifact.
      - name: Build operator binary and Docker image
        uses: ./.github/actions/build-operator
        with:
          image-tag: ${{ steps.version.outputs.version }}
          artifact-name: perf-operator-image-${{ steps.version.outputs.version }}
          cache-key: "perf-build"
          upload-artifact: "true"

      - name: Upload operator binary
        uses: actions/upload-artifact@v7
        with:
          name: perf-artifacts-${{ steps.version.outputs.version }}
          path: target/release/stellar-operator
          retention-days: 7

  benchmark:
    name: "Benchmark (${{ matrix.suite }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, resolve-matrix]
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.resolve-matrix.outputs.suites) }}
    steps:
      - uses: actions/checkout@v7

      - name: Download operator binary
        uses: actions/download-artifact@v8
        with:
          name: perf-artifacts-${{ needs.build.outputs.version }}

      - name: Download operator image tarball
        if: matrix.suite == 'operator' || matrix.suite == 'regression'
        uses: actions/download-artifact@v8
        with:
          name: perf-operator-image-${{ needs.build.outputs.version }}

      - name: Load Docker image
        if: matrix.suite == 'operator' || matrix.suite == 'regression'
        run: |
          gunzip operator-image.tar.gz
          docker load < operator-image.tar

      - name: Setup performance environment
        if: matrix.suite == 'operator' || matrix.suite == 'regression'
        continue-on-error: true
        uses: ./.github/actions/setup-perf-env
        with:
          k6-version: ${{ env.K6_VERSION }}
          cluster-name: perf-${{ matrix.suite }}
          operator-image-tag: ${{ needs.build.outputs.version }}
          worker-nodes: "2"

      - name: Install k6 (webhook suite)
        if: matrix.suite == 'webhook'
        run: |
          K6_VER="${{ env.K6_VERSION }}"
          curl -fsSL \
            "https://github.com/grafana/k6/releases/download/v${K6_VER}/k6-v${K6_VER}-linux-amd64.tar.gz" \
            | tar xvz
          sudo mv "k6-v${K6_VER}-linux-amd64/k6" /usr/local/bin/
          sudo apt-get update && sudo apt-get install -y jq bc

      - name: Start webhook server
        if: matrix.suite == 'webhook'
        run: |
          chmod +x target/release/stellar-operator
          ./target/release/stellar-operator webhook \
            --bind 0.0.0.0:8443 --log-level info &
          echo "WEBHOOK_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            curl -sf http://localhost:8443/health > /dev/null 2>&1 && break
            sleep 2
          done
          curl -sf http://localhost:8443/health \
            || { echo "ERROR: Webhook server failed to start"; exit 1; }

      # ── CRD validation benchmarks (criterion, #1390) ─────────────────────────
      # Self-contained Rust micro-benchmarks (no cluster/API server needed —
      # see benches/crd_operations.rs), so this suite skips the k6/kind/Docker
      # setup above entirely and just needs a Rust toolchain.
      - name: Setup Rust (criterion suite)
        if: matrix.suite == 'criterion'
        uses: ./.github/actions/setup-rust
        with:
          cache-key: "perf-criterion"

      - name: Run CRD validation benchmark (criterion)
        if: matrix.suite == 'criterion'
        continue-on-error: true
        run: |
          mkdir -p results
          cargo bench --bench crd_operations
          python3 scripts/collect-criterion-results.py \
            --criterion-dir target/criterion \
            --output results/crd-benchmark.json

      - name: Upload criterion HTML report
        if: matrix.suite == 'criterion' && always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: criterion-report-${{ needs.build.outputs.version }}
          path: target/criterion
          retention-days: 30

      # ── Helm chart render benchmark (#1390) ──────────────────────────────────
      # `helm template` timing — see scripts/bench-helm-render.sh. Also a pure
      # CLI/chart benchmark, no cluster needed.
      - name: Install Helm (helm suite)
        if: matrix.suite == 'helm'
        uses: azure/setup-helm@v5
        with:
          version: "3.14.0"

      - name: Run Helm render benchmark
        if: matrix.suite == 'helm'
        continue-on-error: true
        run: |
          mkdir -p results
          bash scripts/bench-helm-render.sh --output results/helm-render-benchmark.json

      - name: Determine baseline
        id: baseline
        shell: bash
        run: |
          mkdir -p results
          INPUT_BASELINE="${{ github.event.inputs.baseline_version || 'latest' }}"
          case "${{ matrix.suite }}" in
            webhook)
              [[ "$INPUT_BASELINE" != "latest" ]] && BASELINE="benchmarks/baselines/${INPUT_BASELINE}.json" \
                || BASELINE="benchmarks/baselines/webhook-v0.1.0.json"
              CURRENT="results/webhook-benchmark.json"
              ;;
            criterion)
              [[ "$INPUT_BASELINE" != "latest" ]] && BASELINE="benchmarks/baselines/${INPUT_BASELINE}.json" \
                || BASELINE="benchmarks/baselines/crd-performance-v0.1.0.json"
              CURRENT="results/crd-benchmark.json"
              ;;
            helm)
              [[ "$INPUT_BASELINE" != "latest" ]] && BASELINE="benchmarks/baselines/${INPUT_BASELINE}.json" \
                || BASELINE="benchmarks/baselines/helm-render-v0.1.0.json"
              CURRENT="results/helm-render-benchmark.json"
              ;;
            *)
              if [[ "$INPUT_BASELINE" == "latest" ]]; then
                BASELINE=$(ls -t benchmarks/baselines/v*.json 2>/dev/null | head -1 || echo "benchmarks/baselines/v0.1.0.json")
              else
                BASELINE="benchmarks/baselines/${INPUT_BASELINE}.json"
              fi
              CURRENT="results/benchmark-summary.json"
              ;;
          esac
          echo "baseline_file=$BASELINE" >> "$GITHUB_OUTPUT"
          echo "current_file=$CURRENT" >> "$GITHUB_OUTPUT"
          [[ -f "$BASELINE" ]] && echo "has_baseline=true" >> "$GITHUB_OUTPUT" \
            || echo "has_baseline=false" >> "$GITHUB_OUTPUT"

      - name: Run operator benchmark (k6)
        if: matrix.suite == 'operator'
        continue-on-error: true
        run: |
          k6 run \
            --env BASE_URL=http://localhost:8080 \
            --env K8S_API_URL=http://localhost:8001 \
            --env NAMESPACE=stellar-benchmark \
            --env RUN_ID=${{ github.run_id }} \
            --env VERSION=${{ needs.build.outputs.version }} \
            --env GIT_SHA=${{ github.sha }} \
            --env BASELINE_FILE=${{ steps.baseline.outputs.baseline_file }} \
            --out json=results/k6-output.json \
            benchmarks/k6/operator-load-test.js
          python3 -c "
          import json, os
          raw = 'results/k6-output.json'
          data = []
          if os.path.exists(raw):
              with open(raw) as f:
                  data = [json.loads(l) for l in f if l.strip()]
          summary = {'total_requests': len([d for d in data if d.get('type') == 'Point']),
                     'version': '${{ needs.build.outputs.version }}'}
          with open('results/benchmark-summary.json', 'w') as f:
              json.dump(summary, f, indent=2)
          "

      - name: Run regression benchmark (k6)
        if: matrix.suite == 'regression'
        continue-on-error: true
        run: |
          k6 run \
            --env BASE_URL=http://localhost:8080 \
            --env K8S_API_URL=http://localhost:8001 \
            --env NAMESPACE=stellar-benchmark \
            --env RUN_ID=${{ github.run_id }} \
            --env VERSION=${{ needs.build.outputs.version }} \
            --env GIT_SHA=${{ github.sha }} \
            --env BASELINE_FILE=${{ steps.baseline.outputs.baseline_file }} \
            --out json=results/operator-benchmark-raw.json \
            benchmarks/k6/operator-load-test.js
          python3 -c "
          import json, os
          raw = 'results/operator-benchmark-raw.json'
          data = []
          if os.path.exists(raw):
              with open(raw) as f:
                  data = [json.loads(l) for l in f if l.strip()]
          summary = {'total_requests': len([d for d in data if d.get('type') == 'Point']),
                     'version': '${{ needs.build.outputs.version }}'}
          with open('results/benchmark-summary.json', 'w') as f:
              json.dump(summary, f, indent=2)
          "

      - name: Run webhook benchmark (k6)
        if: matrix.suite == 'webhook'
        continue-on-error: true
        run: |
          k6 run \
            --env WEBHOOK_URL=http://localhost:8443 \
            --env VERSION=${{ needs.build.outputs.version }} \
            --env GIT_SHA=${{ github.sha }} \
            --env RUN_ID=${{ github.run_id }} \
            --env BASELINE_FILE=${{ steps.baseline.outputs.baseline_file }} \
            --out json=results/webhook-benchmark-raw.json \
            benchmarks/k6/webhook-load-test.js

      - name: Stop webhook server
        if: always() && matrix.suite == 'webhook'
        run: '[[ -n "${WEBHOOK_PID:-}" ]] && kill "$WEBHOOK_PID" || true'

      - name: Compare with baseline
        if: steps.baseline.outputs.has_baseline == 'true' && matrix.suite != 'webhook'
        continue-on-error: true
        uses: ./.github/actions/compare-benchmarks
        with:
          current-file: ${{ steps.baseline.outputs.current_file }}
          baseline-file: ${{ steps.baseline.outputs.baseline_file }}
          threshold: ${{ github.event.inputs.regression_threshold || '10' }}
          output-file: results/regression-report-${{ matrix.suite }}.json
          fail-on-regression: "false"

      - name: Collect logs
        if: always() && (matrix.suite == 'operator' || matrix.suite == 'regression')
        run: |
          kubectl logs -n stellar-system -l app=stellar-operator \
            --tail=500 > results/operator-logs-${{ matrix.suite }}.txt || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results-${{ matrix.suite }}-${{ needs.build.outputs.version }}
          path: results/
          retention-days: 30

  report:
    name: Performance Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, benchmark]
    if: always() && needs.build.result == 'success'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all benchmark results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: perf-results-*
          merge-multiple: true
          path: results/

      - name: Write job summary
        if: always()
        run: |
          mkdir -p results
          {
            echo "## Performance & Benchmark Pipeline"
            echo ""
            echo "**Version:** ${{ needs.build.outputs.version }}"
            echo "**Commit:** ${{ github.sha }}"
            echo ""
            for report in results/regression-report-*.json; do
              [[ -f "$report" ]] || continue
              SUITE=$(basename "$report" .json | sed 's/regression-report-//')
              PASSED=$(jq -r '.overall_passed // "unknown"' "$report")
              echo "### $SUITE: $PASSED"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Performance & Benchmark Pipeline

            **Version:** ${{ needs.build.outputs.version }}
            **Commit:** ${{ github.sha }}

            Unified matrix pipeline completed for operator, regression, webhook, criterion
            (CRD validation, benches/crd_operations.rs), and helm (chart render,
            scripts/bench-helm-render.sh) suites. See workflow artifacts for detailed
            results and `docs/benchmarking.md` for how to interpret them.
