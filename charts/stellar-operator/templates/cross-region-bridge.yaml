{{- /*
  cross-region-bridge.yaml
  Creates the Kubernetes resources needed for cross-region state synchronization:
    1. A ClusterRole + ClusterRoleBinding granting the operator read/write access
       to ledger-state ConfigMaps across namespaces.
    2. An ExternalName Service per peer cluster, enabling standby operators to
       reach the primary region's Kubernetes API through DNS without a full
       service mesh.
    3. A NetworkPolicy that allows the state-sync sidecar to reach the Stellar
       Core HTTP port (11626) within the pod.

  Additionally, when failover is enabled, this template provisions the
  global-operator failover controller: a ConfigMap carrying the anti-flapping
  and health-probe tuning, plus a Deployment running the global-operator
  binary that polls the primary cluster's health endpoints and orchestrates
  DNS remapping and Patroni replica promotion.

  Enabled when featureFlags.enableDr == "true" AND crossRegion.enabled == true.
*/ -}}

{{- $crossRegion := .Values.crossRegion | default dict }}
{{- if and .Values.featureFlags.enableDr $crossRegion.enabled }}

# ─── ClusterRole: ledger-state ConfigMap access ──────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "stellar-operator.fullname" . }}-state-sync
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
    stellar.org/component: state-sync
rules:
  # Read/write ledger-state ConfigMaps in any namespace
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
    resourceNames: []
  # Read StellarNode status to compute lag
  - apiGroups: ["stellar.org"]
    resources: ["stellarnodes", "stellarnodes/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
# ─── ClusterRoleBinding ───────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "stellar-operator.fullname" . }}-state-sync
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
    stellar.org/component: state-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "stellar-operator.fullname" . }}-state-sync
subjects:
  - kind: ServiceAccount
    name: {{ include "stellar-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
{{- range $crossRegion.peerClusters }}
{{- if .enabled }}
# ─── ExternalName Service: bridge to peer cluster {{ .clusterId }} ────────────
# This service lets standby operators resolve the primary cluster's
# Kubernetes API server by DNS name, enabling ConfigMap reads across regions.
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "stellar-bridge-%s" .clusterId | trunc 63 | trimSuffix "-" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "stellar-operator.labels" $ | nindent 4 }}
    stellar.org/component: cross-region-bridge
    stellar.org/peer-cluster: {{ .clusterId | quote }}
  annotations:
    stellar.org/region: {{ .region | default "unknown" | quote }}
    stellar.org/bridge-endpoint: {{ .endpoint | quote }}
spec:
  type: ExternalName
  externalName: {{ .endpoint }}
  ports:
    - name: peer
      port: {{ .port | default 11625 }}
      protocol: TCP
    - name: http
      port: 11626
      protocol: TCP
---
{{- end }}
{{- end }}

# ─── NetworkPolicy: allow state-sync sidecar ─────────────────────────────────
# Permits the state-sync sidecar container to reach the local Stellar Core
# HTTP API on port 11626 within the same pod (loopback traffic).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "stellar-operator.fullname" . }}-state-sync-sidecar
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
    stellar.org/component: state-sync
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: stellar-operator
      stellar.org/state-sync: "true"
  policyTypes:
    - Egress
  egress:
    # Allow sidecar → local Stellar Core HTTP (loopback)
    - ports:
        - port: 11626
          protocol: TCP
    # Allow DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow reaching peer cluster bridges (cross-region)
    {{- range $crossRegion.peerClusters }}
    {{- if .enabled }}
    - ports:
        - port: {{ .port | default 11625 }}
          protocol: TCP
        - port: 11626
          protocol: TCP
    {{- end }}
    {{- end }}

{{- if $crossRegion.failover }}
{{- $failover := $crossRegion.failover }}
---
# ─── ConfigMap: failover controller tuning ───────────────────────────────────
# Holds the health-probe cadence, anti-flapping thresholds, DNS provider
# credentials reference, and Patroni promotion command used by the
# global-operator failover controller.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stellar-operator.fullname" . }}-failover
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
    stellar.org/component: failover
data:
  # Poll the primary cluster's health endpoints every 500ms.
  healthPollInterval: {{ $failover.healthPollInterval | default "500ms" | quote }}
  # Anti-flapping: require N consecutive failures before failing over and
  # N consecutive successes before failing back, plus a cooldown window.
  failureThreshold: {{ $failover.failureThreshold | default 6 | quote }}
  recoveryThreshold: {{ $failover.recoveryThreshold | default 12 | quote }}
  flapCooldown: {{ $failover.flapCooldown | default "5m" | quote }}
  # Global DNS record to remap on failover.
  dnsRecordName: {{ $failover.dnsRecordName | default "rpc.stellar.org" | quote }}
  dnsProvider: {{ $failover.dnsProvider | default "route53" | quote }}
  dnsTtl: {{ $failover.dnsTtl | default 30 | quote }}
  # Patroni endpoint used to promote the standby PostgreSQL replica.
  patroniEndpoint: {{ $failover.patroniEndpoint | default "http://patroni:8008" | quote }}
  patroniPromotePath: {{ $failover.patroniPromotePath | default "/switchover" | quote }}
  # Primary health endpoints polled by the global watcher.
  primaryHealthEndpoints: {{ $failover.primaryHealthEndpoints | default (list "http://stellar-core-primary:11626/health" "http://horizon-primary:8000/health") | toJson | quote }}
  # Peer clusters eligible to become the new primary.
  peerClusters: {{ $crossRegion.peerClusters | toJson | quote }}
---
# ─── Deployment: global-operator failover controller ─────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stellar-operator.fullname" . }}-failover
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stellar-operator.labels" . | nindent 4 }}
    stellar.org/component: failover
spec:
  replicas: {{ $failover.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "stellar-operator.selectorLabels" . | nindent 6 }}
      stellar.org/component: failover
  template:
    metadata:
      labels:
        {{- include "stellar-operator.selectorLabels" . | nindent 8 }}
        stellar.org/component: failover
      annotations:
        # Force a rolling restart when failover tuning changes.
        checksum/failover-config: {{ include (print $.Template.BasePath "/cross-region-bridge.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "stellar-operator.serviceAccountName" . }}
      containers:
        - name: global-operator
          image: "{{ $failover.image.repository | default .Values.image.repository }}:{{ $failover.image.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ $failover.image.pullPolicy | default .Values.image.pullPolicy }}
          args:
            - "failover"
            - "--config=/etc/global-operator/failover.yaml"
          env:
            - name: RUST_LOG
              value: {{ $failover.logLevel | default "info" | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if $failover.dnsProviderCredentialsSecret }}
            - name: DNS_PROVIDER_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: {{ $failover.dnsProviderCredentialsSecret }}
                  key: {{ $failover.dnsProviderCredentialsKey | default "credentials" }}
            {{- end }}
          volumeMounts:
            - name: failover-config
              mountPath: /etc/global-operator
              readOnly: true
          resources:
            {{- toYaml ($failover.resources | default dict) | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: failover-config
          configMap:
            name: {{ include "stellar-operator.fullname" . }}-failover
{{- end }}

{{- end }}
