apiVersion: v2
name: stellar-operator
description: A Helm chart for the Stellar-K8s Kubernetes Operator
type: application
version: 2.4.0
appVersion: "2.4.0"
keywords:
  - stellar
  - kubernetes
  - operator
  - blockchain
  - soroban
maintainers:
  - name: Stellar K8s Contributors
    url: https://github.com/stellar/stellar-k8s
sources:
  - https://github.com/stellar/stellar-k8s

# OCI / Chart Museum publishing metadata (issue #1375)
annotations:
  # Artifact Hub display metadata
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "true"
  artifacthub.io/operatorCapabilities: Full Lifecycle
  artifacthub.io/prerelease: "false"
  artifacthub.io/category: integration-delivery
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/stellar-k8s/stellar-operator

  # OCI registry metadata — consumed by helm-release.yml
  # The workflow reads these to construct the push target
  oci.registry: ghcr.io
  oci.repository: "{{ .Values.global.ociRepository | default \"otowoorg/helm-charts\" }}"

  # Conventional-commits versioning policy (consumed by bump-chart-version.sh)
  # Values: major | minor | patch | none (controls minimum bump floor)
  versioning.min-bump: patch

  # Changelog URL template — populated by the release workflow
  changelog.url: https://github.com/OtowoOrg/Stellar-K8s/blob/main/CHANGELOG.md

  # Source image that the operator Deployment uses (kept in sync by release workflow)
  app.kubernetes.io/version: "0.1.0"
  app.kubernetes.io/managed-by: Helm
  app.kubernetes.io/part-of: stellar-k8s
