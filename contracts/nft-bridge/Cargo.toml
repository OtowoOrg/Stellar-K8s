# Standalone workspace so this crate is not conflated with the operator
# workspace at the repository root.
[workspace]

[package]
name = "nft-bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Cross-chain NFT (ERC-721 <-> Soroban) bridge vault"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "23.5.3"

[dev-dependencies]
soroban-sdk = { version = "23.5.3", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
