name: Federation Secrets Sync

# Issue #1881: expose `make federation-secrets-sync` to automation without
# requiring a live federation stack. The Makefile target skips cleanly when the
# source/target context or the secret is unavailable and propagates real
# failures from scripts/sync-federation-secrets.sh.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the sync plan without contacting clusters"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'scripts/sync-federation-secrets.sh'
      - 'docs/federation.md'
      - 'Makefile'
      - '.github/workflows/federation-secrets-sync.yml'

permissions:
  contents: read

jobs:
  federation-secrets-sync:
    name: Federation Secret Sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_CLUSTER: ${{ vars.FEDERATION_SOURCE_CLUSTER }}
      TARGET_CLUSTER: ${{ vars.FEDERATION_TARGET_CLUSTER }}
      SECRET_NAME: ${{ vars.FEDERATION_SECRET_NAME }}
      NAMESPACE: ${{ vars.FEDERATION_NAMESPACE || 'stellar-system' }}
      DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # No kubectl installation step: the target skips cleanly when kubectl or
      # the federation secret is not available to the runner.
      - name: Run guarded federation secrets sync
        run: make federation-secrets-sync

      - name: Summarize result
        if: always()
        run: |
          echo "## Federation secrets sync" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: \`make federation-secrets-sync\` (dry run: \`${DRY_RUN}\`)." >> "$GITHUB_STEP_SUMMARY"
