name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SHELLCHECK_EXCLUDES: ""
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ──────────────────────────────────────────────────────────────────────────────
# Pipeline architecture
# ──────────────────────────────────────────────────────────────────────────────
# preflight (strict toolchain version gate) ─┐
# changes ────────────────────────────────┬──┴── lint ─────────────────────────┐
#                                          ├── security-audit ────────────────┐ │
#                                          ├── helm-lint (helm changes only)   │ │
#                                          ├── examples-smoke-test (examples) │ │
#                                          └── api-docs (api_docs changes)     │ │
#                                                                             ▼ ▼
# changes ──┬── lint ──────────────────────────────────────────────────────────┐
#           ├── security-audit ──────────────────────────────────────────────┐ │
#           ├── helm-lint (helm changes only)                                 │ │
#           ├── examples-smoke-test (examples changes only)                   │ │
#           ├── api-docs (api_docs changes only)                              │ │
#           └── crd-drift (api_docs changes only)                             │ │
#                                                                             ▼ ▼
#                                  │ │
#                                                                             ▼
#                                                                    test ─── coverage
#                                                                      │
#                                                                    docker (main only)
#                                                                      │
#                                                                    security-scan
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  # ── 1. Change detection ─────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docker: ${{ steps.detect.outputs.docker }}
      helm: ${{ steps.detect.outputs.helm }}
      api_docs: ${{ steps.detect.outputs.api_docs }}
      rust_core: ${{ steps.detect.outputs.rust_core }}
      deps: ${{ steps.detect.outputs.deps }}
      examples: ${{ steps.detect.outputs.examples }}
      yaml_schema: ${{ steps.detect.outputs.yaml_schema }}
      db_migrations: ${{ steps.detect.outputs.db_migrations }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect changed file groups
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          # First push on a new branch has no before SHA — treat as full change
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            for key in docker helm api_docs rust_core deps examples yaml_schema db_migrations; do
              echo "${key}=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)
          echo "Changed files:"
          echo "$CHANGED"

          _match() { echo "$CHANGED" | grep -Eq "$1" && echo "true" || echo "false"; }

          echo "docker=$(_match \
            '^(Dockerfile|\.dockerignore|Cargo\.toml|Cargo\.lock|src/|config/|Makefile)')" \
            >> "$GITHUB_OUTPUT"
          echo "helm=$(_match \
            '^(charts/|config/crd/|config/samples/|examples/|Makefile)')" \
            >> "$GITHUB_OUTPUT"
          echo "api_docs=$(_match \
            '^(docs/|scripts/generate-api-docs\.py|config/crd/|src/crd/|src/rest_api/|Makefile)')" \
            >> "$GITHUB_OUTPUT"
          echo "rust_core=$(_match \
            '^(src/|Cargo\.toml|Cargo\.lock|Makefile|build\.rs)')" \
            >> "$GITHUB_OUTPUT"
          echo "deps=$(_match '^(Cargo\.toml|Cargo\.lock)')" >> "$GITHUB_OUTPUT"
          echo "examples=$(_match \
            '^(examples/|config/crd/|config/samples/)')" \
            >> "$GITHUB_OUTPUT"
          echo "yaml_schema=$(_match \
            '^(\.yamllint\.yml|schemas/|config/crd/|config/yaml-validation\.yaml|charts/|examples/|scripts/ci/validate-yaml\.sh|scripts/ci/extract-crd-json-schemas\.py|scripts/validate-yaml-manifests\.py)')" \
            >> "$GITHUB_OUTPUT"
          echo "db_migrations=$(_match \
            '^(db/|src/db_migrations\.rs|tests/db_migration_harness\.rs|scripts/ci/test-db-migrations\.sh)')" \
            >> "$GITHUB_OUTPUT"

  # ── 1.5 Repository preflight gate ───────────────────────────────────────────
  # Strictly enforces the pinned minimum toolchain versions in
  # scripts/lib/versions.sh (see docs/development in that file for details).
  # Every substantive job below depends on this passing.
  preflight:
    name: Preflight (toolchain versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: "ci-preflight"

      - name: Install pinned kubectl, helm, and kind
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/versions.sh
          source scripts/lib/versions.sh
          echo "Installing pins: kubectl=${KUBECTL_VERSION} helm=${HELM_VERSION} kind=${KIND_VERSION}"
          curl -fsSL -o kubectl "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/kubectl
          curl -fsSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          curl -fsSL -o kind "https://kind.sigs.k8s.io/dl/v${KIND_VERSION}/kind-linux-amd64"
          chmod +x kind && sudo mv kind /usr/local/bin/kind
          command -v kubectl helm kind
          kubectl version --client
          helm version --short
          kind version

      - name: Run preflight tool/version gate
        run: make preflight

  # ── 2. Version consistency (main push only) ──────────────────────────────────
  version-consistency:
    name: Version Consistency Check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: "ci-version"

      - name: Verify Cargo.toml and binary version match
        run: |
          set -euo pipefail
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          EXPECTED_VERSION="${EXPECTED_RELEASE_VERSION:-}"
          if [[ -z "$EXPECTED_VERSION" && "${GITHUB_REF:-}" =~ ^refs/tags/v ]]; then
            EXPECTED_VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          EXPECTED_VERSION="${EXPECTED_VERSION:-$CARGO_VERSION}"

          K8S_OPENAPI_ENABLED_VERSION=1.30 cargo build --locked --bin stellar-operator
          BIN_VERSION=$(./target/debug/stellar-operator version \
            | sed -n 's/^Stellar-K8s Operator v//p' | head -1)

          echo "Expected: $EXPECTED_VERSION | Cargo: $CARGO_VERSION | Binary: $BIN_VERSION"

          [[ "$CARGO_VERSION" == "$EXPECTED_VERSION" ]] || {
            echo "::error::Cargo.toml version ($CARGO_VERSION) != expected ($EXPECTED_VERSION)"
            exit 1
          }
          [[ "$BIN_VERSION" == "$EXPECTED_VERSION" ]] || {
            echo "::error::Binary version ($BIN_VERSION) != expected ($EXPECTED_VERSION)"
            exit 1
          }

  # ── 2.5. Repository Hygiene ────────────────────────────────────────────────────
  repo-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cache Key Consistency
        run: bash scripts/ci/check-cache-keys.sh

      - name: Setup Kubeconform
        run: |
          KUBECONFORM_VERSION="v0.6.4"
          wget -qO- https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz | tar -xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Config Samples
        run: bash scripts/ci/validate-config-samples.sh

      # ── Issue #1044: repository-wide YAML schema validation ────────────────
      # Broader than the kubeconform pass above: covers every YAML file, hard
      # fails on syntax/structure problems, and validates custom resources
      # against this repo's own CRDs rather than skipping them.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YAML tooling
        run: pip install --quiet pyyaml jsonschema

      - name: Validate all YAML manifests
        run: python3 scripts/validate-yaml-manifests.py

      - name: Run YAML validator unit tests
        run: python3 -m unittest scripts.tests.test_validate_yaml_manifests

      - name: Install yamllint
        run: pip install --quiet yamllint==1.35.1

      - name: Check generated CRD JSON schemas
        run: python3 scripts/ci/extract-crd-json-schemas.py --check

      - name: Check Stale TODOs
        run: bash scripts/ci/check-stale-todos.sh

  # ── 3. Lint & Format ─────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: [changes, preflight]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: "ci-lint"
          toolchain: "1.92"
          components: "rustfmt clippy"

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          mapfile -t shell_files < <(find scripts -type f -name "*.sh" 2>/dev/null || true)
          if [[ "${#shell_files[@]}" -eq 0 ]]; then
            echo "No shell scripts found — skipping shellcheck"
            exit 0
          fi
          shellcheck_cmd=(shellcheck -S error)
          [[ -n "${SHELLCHECK_EXCLUDES}" ]] && shellcheck_cmd+=(-e "${SHELLCHECK_EXCLUDES}")
          "${shellcheck_cmd[@]}" "${shell_files[@]}"

      # ── Issue #1049: static analysis gate for unsafe shell patterns ────────
      # shellcheck -S error deliberately ignores patterns that are stylistic to
      # a linter but operational here (unguarded rm -rf paths, eval on
      # interpolated data, curl | bash, missing strict mode). This gate covers
      # those; see docs/development/static-analysis-gates.md.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YAML tooling
        run: pip install --quiet pyyaml jsonschema

      - name: Run shell safety gate
        run: python3 scripts/check-shell-safety.py

      - name: Run shell safety gate unit tests
        run: python3 -m unittest scripts.tests.test_check_shell_safety

      - name: Check formatting
        if: needs.changes.outputs.rust_core == 'true'
        run: make fmt-check

      - name: Run clippy (deny all warnings as errors)
        if: needs.changes.outputs.rust_core == 'true'
        run: make lint

      - name: Run clippy (strict mode - fail on all warnings)
        if: needs.changes.outputs.rust_core == 'true'
        run: make lint-strict

      # ── Issue #1138: rustdoc warnings-as-errors ────────────────────────────
      # Runs cargo doc with RUSTDOCFLAGS="-D warnings" so that any missing
      # or malformed doc comments cause a hard CI failure instead of silently
      # passing.  This mirrors the strict-warnings policy applied to clippy.
      - name: Check rustdoc (warnings as errors)
        if: needs.changes.outputs.rust_core == 'true'
        run: |
          set -euo pipefail
          echo "→ Running cargo doc with RUSTDOCFLAGS=-D warnings..."
          RUSTDOCFLAGS="-D warnings -A rustdoc::bare_urls -A rustdoc::broken_intra_doc_links -A rustdoc::private_intra_doc_links" K8S_OPENAPI_ENABLED_VERSION=1.30 \
            cargo doc \
              --no-deps \
              --workspace \
              --features "rest-api,metrics,admission-webhook,k8s-v1-30" \
              2>&1 | tee /tmp/rustdoc.log
          echo "✓ rustdoc passed — no documentation warnings"

  # ── 3.5. Repo-wide link check (lychee) — primary PR link gate ────────────────
  # Primary link checker for PRs/pushes. markdown-link-check and the Python
  # docs-link-check job were removed as overlapping coverage of *.md.
  # Lychee scans documentation files (Markdown + HTML) for broken links —
  # anchors, redirects, and rot — plus example manifests under examples/.
  # Other source files (*.rs, *.toml, *.sh, non-example *.yaml) are still
  # intentionally NOT scanned: their URL string literals are K8s service DNS,
  # cloud metadata endpoints, and format-string fragments that lychee cannot
  # reach from CI and that aren't meaningful "links" anyway. In-cluster service
  # DNS that does appear inside examples/ (e.g. stellar-core:11626) is excluded
  # by hostname pattern in `lychee.toml` instead of dropping the whole
  # directory. Excludes and accept-codes live in `lychee.toml`. Runs on every
  # push/PR to catch link issues. Scheduled link-rot detection (weekly check) is
  # not currently covered; local: `python3 scripts/check-links.py` remains
  # available via make health for local validation.
  repo-wide-link-check:
    name: Repo-Wide Link Check (lychee)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: (optional) Restore lychee cache removed
        run: echo "Skipping cache restore in CI to satisfy repository hygiene checks. Lychee will run without cache."

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --no-progress
            --cache
            './**/*.md'
            './**/*.html'
            './examples/**/*.yaml'
            './examples/**/*.yml'
          # External doc hosts flake from GHA IPs (TLS resets). Keep the
          # report visible but do not hard-fail the PR on transient network errors.
          fail: false

  # ── 3b. Secret-handling checks (Issue #1116) ────────────────────────────────
  secret-checks:
    name: Secret Handling Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes]
    steps:
      - uses: actions/checkout@v4

      - name: Run secret-handling checks
        run: |
          chmod +x scripts/check-secrets.sh
          bash scripts/check-secrets.sh

  # ── 3b1. Failure diagnostics collector self-test (Issue #1151) ─────────────
  failure-diagnostics:
    name: Failure Diagnostics Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes]
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run diagnostics collector unit tests
        run: |
          chmod +x scripts/ci/collect-failure-diagnostics.sh
          bats scripts/tests/failure-diagnostics.bats

      - name: Assemble demo bundle artifact
        if: always()
        run: |
          bash scripts/ci/collect-failure-diagnostics.sh \
            --no-cluster \
            --bundle-dir /tmp/ci-diagnostics-selftest \
            --job-name failure-diagnostics \
            --run-id "${{ github.run_id }}" \
            --sha "${{ github.sha }}"

      - name: Upload self-test diagnostics bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-selftest-${{ github.run_id }}
          path: /tmp/ci-diagnostics-selftest/
          retention-days: 7

  # ── 3b2. Unreachable modules & dead code paths (Issue #1150) ────────────────
  unreachable-modules:
    name: Unreachable Modules & Dead Code Paths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.rust_core == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: "ci-unreachable-modules"

      - name: Run unreachable module static checks
        run: |
          chmod +x scripts/check-unreachable-modules.sh
          bash scripts/check-unreachable-modules.sh

      - name: Run unit tests for the checker
        run: cargo test --locked --bin check-unreachable-modules

      - name: Upload unreachable-modules report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unreachable-modules-report-${{ github.run_id }}
          path: |
            config/unreachable-modules-allowlist.txt
            docs/unreachable-modules-check.md
          if-no-files-found: ignore
          retention-days: 14

  # ── 3b3. Pipeline log redaction checks (Issue #1153) ────────────────────────
  pipeline-log-redaction:
    name: Pipeline Log Redaction
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.rust_core == 'true' || needs.changes.outputs.deps == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Detect redaction checker presence
        id: redaction
        run: |
          if [[ -f scripts/check-pipeline-log-redaction.sh ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Pipeline log redaction checker not on this branch; skipping."
          fi

      - name: Setup Rust
        if: steps.redaction.outputs.present == 'true'
        uses: ./.github/actions/setup-rust
        with:
          cache-key: "ci-pipeline-log-redaction"

      - name: Run pipeline log redaction checks
        if: steps.redaction.outputs.present == 'true'
        run: |
          chmod +x scripts/check-pipeline-log-redaction.sh
          bash scripts/check-pipeline-log-redaction.sh \
            --fixture tests/fixtures/pipeline_logs/dirty-ci-sample.txt

      - name: Run unit tests for the checker
        if: steps.redaction.outputs.present == 'true'
        run: cargo test --locked --bin check-pipeline-log-redaction

  # ── 3c. Feature & dead-import audit (Issue #1114) ────────────────────────────
  feature-audit:
    name: Feature & Dead-Import Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.rust_core == 'true' || needs.changes.outputs.deps == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: "ci-feature-audit"

      - name: Run feature & dead-import audit
        run: |
          chmod +x scripts/audit-features.sh
          bash scripts/audit-features.sh --report

  # ── 4. Security audit (only when deps change) ────────────────────────────────
  security-audit:
    name: Security Audit
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: "ci-audit"
          extra-tools: "cargo-audit"

      - name: Run cargo audit
        run: cargo audit

      - name: Verify third-party license references are up to date
        run: make check-third-party-licenses

  # ── 4.5. CRD Backward-Compatibility Gate ──────────────────────────────────────
  # PR CRD compatibility is enforced by the tested Python path in
  # quickstart-validation.yml (`crd_migration_lint.py` + unit tests).
  # scripts/check-crd-compatibility.sh remains for local/ad-hoc use only.
  # See .github/CI_COMMANDS.md.

  # ── 5. Helm lint (only when helm/chart files change) ─────────────────────────
  helm-lint:
    name: Helm Lint & Schema Validation
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: "3.14.0"

      - name: Lint chart (default values)
        run: make helm-lint

      - name: Schema rejects invalid logLevel
        run: |
          printf 'operator:\n  logLevel: verbose\n' > /tmp/bad-loglevel.yaml
          helm lint charts/stellar-operator -f /tmp/bad-loglevel.yaml 2>&1 \
            | grep -q "must be one of" \
            && echo "Schema correctly rejected invalid logLevel" \
            || { echo "ERROR: Schema did not reject invalid logLevel"; exit 1; }

      - name: Schema rejects invalid service type
        run: |
          printf 'service:\n  type: ExternalName\n' > /tmp/bad-service.yaml
          helm lint charts/stellar-operator -f /tmp/bad-service.yaml 2>&1 \
            | grep -q "must be one of" \
            && echo "Schema correctly rejected invalid service type" \
            || { echo "ERROR: Schema did not reject invalid service type"; exit 1; }

      - name: Schema rejects invalid pullPolicy
        run: |
          printf 'image:\n  pullPolicy: Whenever\n' > /tmp/bad-pullpolicy.yaml
          helm lint charts/stellar-operator -f /tmp/bad-pullpolicy.yaml 2>&1 \
            | grep -q "must be one of" \
            && echo "Schema correctly rejected invalid pullPolicy" \
            || { echo "ERROR: Schema did not reject invalid pullPolicy"; exit 1; }

      - name: Validate Helm template rendering
        run: |
          helm template stellar-operator charts/stellar-operator > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml && echo "Template rendered successfully" || exit 1

      - name: Validate template with high replica count
        run: |
          helm template stellar-operator charts/stellar-operator \
            --set operator.replicas=3 > /tmp/rendered-3replicas.yaml
          test -s /tmp/rendered-3replicas.yaml && echo "Template with replicas=3 rendered successfully" || exit 1

      - name: Validate template with custom resource limits
        run: |
          helm template stellar-operator charts/stellar-operator \
            --set resources.limits.cpu=2 \
            --set resources.limits.memory=2Gi > /tmp/rendered-custom-resources.yaml
          test -s /tmp/rendered-custom-resources.yaml && echo "Template with custom resources rendered successfully" || exit 1

      - name: Chart dependencies validation
        run: |
          test -f charts/stellar-operator/Chart.yaml || exit 1
          echo "Chart.yaml exists and is valid"

  # ── 6. Helm unit tests ────────────────────────────────────────────────────────
  helm-test:
    name: Helm Unit Tests
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, lint]
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v0.5.1

      - name: Run Helm unit tests
        run: helm unittest charts/stellar-operator --strict --color

      - name: Helm upgrade preservation
        run: bash scripts/ci/helm-upgrade-test.sh

  # ── 6b. YAML lint + CRD schema drift + Helm-render kubeconform (#1291) ────────
  yaml-schema:
    name: YAML Lint & Schema Validation
    if: needs.changes.outputs.yaml_schema == 'true' || needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install yamllint and PyYAML
        run: pip install --quiet yamllint==1.35.1 pyyaml

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: "3.14.0"

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION="v0.6.4"
          wget -qO- https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz | tar -xz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: Run YAML / CRD / Helm schema validation
        run: bash scripts/ci/validate-yaml.sh

  # ── 6c. Database migration harness (#1317) ───────────────────────────────────
  db-migrations:
    name: Database Migration Tests
    if: needs.changes.outputs.db_migrations == 'true' || needs.changes.outputs.rust_core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, lint]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stellar
          POSTGRES_PASSWORD: stellar_test
          POSTGRES_DB: stellar_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stellar -d stellar_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://stellar:stellar_test@localhost:5432/stellar_migration_test
      STELLAR_MIGRATION_TEST: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: "ci-db-migrations"

      - name: Run migration harness
        run: bash scripts/ci/test-db-migrations.sh

  # ── 7. API docs drift check ───────────────────────────────────────────────────
  api-docs:
    name: API Docs Drift Check
    if: needs.changes.outputs.api_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, lint]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check API docs are up to date
        run: make check-api-docs

      - name: Check OpenAPI specification coverage
        run: make check-openapi-spec

  # ── 7a. CRD drift check ─────────────────────────────────────────────────────────
  crd-drift:
    name: CRD Drift Check
    if: needs.changes.outputs.api_docs == 'true'
    runs-on: ubuntu-latest
    needs: [changes, lint]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: "ci-crd-drift"

      - name: Regenerate CRDs
        id: crdgen
        continue-on-error: true
        run: |
          set -euo pipefail
          # Run crdgen directly (not via `make crd-gen`) so a kube-core schema
          # panic fails this step instead of being masked by a pipe to sort-manifests.
          cargo run --locked --bin crdgen > /tmp/crdgen-raw.yaml
          python3 scripts/sort-manifests.py /tmp/crdgen-raw.yaml > config/crd/stellarnode-crd.yaml

      - name: Fail if CRDs are out of date
        if: steps.crdgen.outcome == 'success'
        run: |
          if ! git diff --exit-code config/crd/; then
            echo "ERROR: config/crd/ is out of date with src/crd/ Rust types."
            echo "Run 'make crd-gen' and commit the result."
            exit 1
          fi
          echo "OK: config/crd/ is up to date."

      - name: Skip drift compare when crdgen is blocked
        if: steps.crdgen.outcome != 'success'
        run: |
          echo "::warning::crdgen failed (known kube-core schema hoist panic on StellarNetwork enums)."
          echo "Skipping CRD drift compare; committed CRD remains the source of truth until crdgen is fixed."
          git checkout -- config/crd/ || true

  # ── 7b. Docs link check ───────────────────────────────────────────────────────
  # Removed: overlapped lychee (`repo-wide-link-check`). Keep
  # `python3 scripts/check-links.py` for local make health / checklist use.

  # ── 7c. Manifest ordering check (issue #1139) ────────────────────────────────
  # Verifies that generated manifests (CRDs, Helm renders) are committed in
  # the canonical sorted order produced by scripts/sort-manifests.py.  This
  # prevents non-deterministic YAML from causing spurious diffs in PRs and
  # makes pipeline output reproducible regardless of Go/Rust map iteration order.
  manifest-order:
    name: Deterministic Manifest Order
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.helm == 'true' || needs.changes.outputs.rust_core == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: "3.14.0"

      - name: Verify CRD manifest is in sorted order
        run: |
          set -euo pipefail
          echo "→ Checking sort-manifests.py produces deterministically sorted CRD output..."
          python3 scripts/sort-manifests.py config/crd/stellarnode-crd.yaml \
            > /tmp/stellarnode-crd-sorted.yaml
          python3 scripts/sort-manifests.py config/crd/stellarnode-crd.yaml \
            > /tmp/stellarnode-crd-sorted-b.yaml
          if ! diff -u /tmp/stellarnode-crd-sorted.yaml /tmp/stellarnode-crd-sorted-b.yaml; then
            echo "::error::sort-manifests.py is not deterministic across runs."
            exit 1
          fi
          python3 - <<'PY'
          import sys
          import yaml

          def keys_sorted(obj):
              if isinstance(obj, dict):
                  keys = list(obj.keys())
                  if keys != sorted(keys):
                      return False
                  return all(keys_sorted(v) for v in obj.values())
              if isinstance(obj, list):
                  return all(keys_sorted(i) for i in obj)
              return True

          sorted_docs = [d for d in yaml.safe_load_all(open("/tmp/stellarnode-crd-sorted.yaml")) if d is not None]
          if not sorted_docs:
              print("::error::sort-manifests.py produced no documents.")
              sys.exit(1)
          if not all(keys_sorted(d) for d in sorted_docs):
              print("::error::sort-manifests.py produced unsorted keys.")
              sys.exit(1)
          print("✓ sort-manifests.py CRD output is deterministic and key-sorted")
          PY

      - name: Verify Helm-rendered manifest is deterministic
        run: |
          set -euo pipefail
          echo "→ Rendering Helm chart twice and comparing outputs..."
          helm template stellar-operator charts/stellar-operator \
            | python3 scripts/sort-manifests.py > /tmp/render-a.yaml
          helm template stellar-operator charts/stellar-operator \
            | python3 scripts/sort-manifests.py > /tmp/render-b.yaml
          if ! diff -u /tmp/render-a.yaml /tmp/render-b.yaml; then
            echo "::error::Helm template output is not deterministic between runs."
            exit 1
          fi
          echo "✓ Helm-rendered manifests are deterministic"

  # ── 8. Examples smoke test ────────────────────────────────────────────────────
  examples-smoke-test:
    name: Examples Smoke Test
    if: needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    steps:
      - uses: actions/checkout@v7

      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: examples-test

      - name: Apply StellarNode CRD
        run: kubectl apply -f config/crd/stellarnode-crd.yaml

      - name: Run smoke test on examples
        run: |
          mkdir -p /tmp/examples-smoke-triage
          for ns in stellar stellar-nodes stellar-system metallb-system; do
            kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
          done
          status=0
          for f in validator-mainnet validator-testnet horizon soroban-rpc dr-setup; do
            if kubectl apply --dry-run=server -f "examples/${f}.yaml" \
              > "/tmp/examples-smoke-triage/${f}.log" 2>&1; then
              cat "/tmp/examples-smoke-triage/${f}.log"
            else
              echo "FAILED: examples/${f}.yaml"
              cat "/tmp/examples-smoke-triage/${f}.log"
              status=1
            fi
          done
          exit "$status"

      # ── Failure triage (unified diagnostics bundle — issue #1151) ─────────
      # A regression here usually means an example manifest drifted out of
      # sync with the CRD schema. Capture apply logs + live CRD/event state
      # into the standard diagnostics bundle so reviewers can triage without
      # re-running the job locally.
      - name: Capture cluster diagnostics
        if: failure()
        run: |
          kubectl get crd stellarnodes.stellar.org -o yaml \
            > /tmp/examples-smoke-triage/crd-state.yaml 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp \
            > /tmp/examples-smoke-triage/cluster-events.log 2>&1 || true

      - name: Upload failure diagnostics bundle
        if: failure()
        uses: ./.github/actions/collect-failure-diagnostics
        with:
          artifact-name: ci-diagnostics-examples-smoke-${{ github.run_id }}
          operator-namespace: stellar-system
          extra-namespaces: stellar stellar-nodes metallb-system
          extra-paths: |
            /tmp/examples-smoke-triage
          retention-days: "14"

  # ── 8.5. Stale Sample Manifest Detector ──────────────────────────────────────
  # Validates that sample manifests in config/samples/ are syntactically valid,
  # conform to the current CRD schema, and don't have missing required fields.
  # Related: #1146 - Create automated stale sample manifest detector and fixer
  stale-sample-check:
    name: Stale Sample Manifest Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.examples == 'true' || needs.changes.outputs.helm == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Run stale sample manifest check
        run: bash scripts/check-stale-samples.sh

  # ── 9. Tests (unit + doc) ─────────────────────────────────────────────────────
  # security-audit is conditional (only runs when deps change). We use
  # `if: always()` + an explicit check so test/coverage still run when
  # security-audit was skipped, but are blocked when it actually failed.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [security-audit, lint, secret-checks, pipeline-log-redaction]
    if: >-
      always() &&
      needs.lint.result == 'success' &&
      needs.secret-checks.result == 'success' &&
      (needs.security-audit.result == 'success' || needs.security-audit.result == 'skipped') &&
      (needs.pipeline-log-redaction.result == 'success' || needs.pipeline-log-redaction.result == 'skipped')
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: "ci-test"

      - name: Run tests
        run: make test

  # ── 10. Code coverage ─────────────────────────────────────────────────────────
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [security-audit, lint, secret-checks, pipeline-log-redaction]
    if: >-
      github.event_name != 'pull_request' &&
      always() &&
      needs.lint.result == 'success' &&
      needs.secret-checks.result == 'success' &&
      (needs.security-audit.result == 'success' || needs.security-audit.result == 'skipped') &&
      (needs.pipeline-log-redaction.result == 'success' || needs.pipeline-log-redaction.result == 'skipped')
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: "ci-coverage"
          extra-tools: "cargo-tarpaulin"

      - name: Generate coverage
        run: |
          cargo tarpaulin \
            --out Xml \
            --timeout 300 \
            --exclude-files tests/* \
            --ignore-panics \
            --ignore-tests

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./cobertura.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── 10b. Image vulnerability gate (pull requests) ─────────────────────────────
  # Issue #1334: critical vulnerabilities must block merge. The `docker` job
  # below only runs on non-PR events, so before this job a pull request could
  # introduce a critical CVE in the image and never be told. Builds locally and
  # does not push — nothing from an unreviewed PR reaches the registry.
  image-scan:
    name: Image Vulnerability Gate
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: false
          load: true
          tags: stellar-operator:pr-scan
          cache-from: type=gha,scope=stellar-k8s-docker
          provenance: false
          sbom: false

      - name: Scan image and block on critical vulnerabilities
        uses: ./.github/actions/security-scan
        with:
          image-ref: stellar-operator:pr-scan
          severity: "CRITICAL,HIGH"
          fail-on-severity: "CRITICAL"

  # ── 11. Docker build & push (main push only) ──────────────────────────────────
  docker:
    name: Docker Build
    if: >-
      github.event_name != 'pull_request' &&
      needs.changes.outputs.docker == 'true' &&
      (needs.helm-test.result == 'success' || needs.helm-test.result == 'skipped') &&
      (needs.api-docs.result == 'success' || needs.api-docs.result == 'skipped') &&
      (needs.crd-drift.result == 'success' || needs.crd-drift.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, helm-test, api-docs, crd-drift]
    env:
      DOCKER_PLATFORMS: linux/amd64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Docker & Login
        id: setup-docker
        uses: ./.github/actions/setup-docker
        with:
          registry: ${{ env.REGISTRY }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.setup-docker.outputs.image-name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=stellar-k8s-docker
          cache-to: type=gha,mode=max,scope=stellar-k8s-docker
          provenance: false
          sbom: false
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  # ── 12. Security Scan & Binary Verification (main push only) ────────────────────────────────
  security-scan:
    name: Security Scan & Binary Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: docker
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Docker & Login
        id: setup-docker
        uses: ./.github/actions/setup-docker
        with:
          registry: ${{ env.REGISTRY }}

      - name: Pull image for verification
        run: |
          docker pull ${{ env.REGISTRY }}/${{ steps.setup-docker.outputs.image-name }}:sha-${{ github.sha }}

      - name: Verify binaries boot
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ steps.setup-docker.outputs.image-name }}:sha-${{ github.sha }} version
          echo "✓ stellar-operator boots"

          docker run --rm --entrypoint /stellar-fork-detector ${{ env.REGISTRY }}/${{ steps.setup-docker.outputs.image-name }}:sha-${{ github.sha }} --help
          echo "✓ stellar-fork-detector boots"

          docker run --rm --entrypoint /stellar-watcher ${{ env.REGISTRY }}/${{ steps.setup-docker.outputs.image-name }}:sha-${{ github.sha }} --help
          echo "✓ stellar-watcher boots"

      - name: Security Scan
        uses: ./.github/actions/security-scan
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.setup-docker.outputs.image-name }}:sha-${{ github.sha }}

  # ── 13. Chart Render Diff Check ───────────────────────────────────────────────
  # Detects unintended Helm chart template drift by comparing rendered output
  # against the render goldens committed under charts/stellar-operator/rendered/.
  # Related: #1045 - Add automated drift detection between Helm templates and
  # rendered manifests. Supersedes the previous chart-diff check, whose baseline
  # lived in gitignored .cache/ and was therefore recreated (never compared) on
  # every CI run.
  chart-diff-check:
    name: Helm Template Drift Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.helm == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: "3.14.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YAML tooling
        run: pip install --quiet pyyaml

      - name: Detect Helm template drift
        run: bash scripts/check-helm-drift.sh

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run drift gate unit tests
        run: bats scripts/tests/helm-drift.bats

  # ── 15b. Chart Versioning Unit Tests ──────────────────────────────────────
  # Bats tests for scripts/bump-chart-version.sh (issue #1319): SemVer bump
  # rules from conventional commits and the versioning.min-bump floor.
  chart-versioning-tests:
    name: Chart Versioning Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run chart versioning unit tests
        run: bats scripts/tests/bump-chart-version.bats

  # ── 16. Benchmark Sanity Check ────────────────────────────────────────────────
  # Runs quick benchmark sanity checks in PR pipelines to catch regressions.
  # Related: #1144 - Add reproducible benchmark sanity checks in pull request pipelines
  benchmark-sanity-check:
    name: Benchmark Sanity Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test]
    if: >-
      always() &&
      needs.test.result == 'success'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: "ci-bench-sanity"

      - name: Run benchmark sanity checks
        run: bash scripts/check-benchmark-sanity.sh
  # ── 15. Dependency graph expansion guard (#1141) ──────────────────────────────
  #
  # Blocks PRs that silently balloon the transitive dependency count.
  # The check runs on every PR that touches Cargo.toml or Cargo.lock.
  # It compares the number of unique crate names in the current Cargo.lock
  # against the baseline stored on main and fails when growth exceeds
  # DEP_GROWTH_LIMIT (default: 10 new crates per PR).
  #
  # On a direct push to main the job records the new baseline as a
  # workflow summary so it can be copy-pasted into the constant below
  # when intentional growth is merged.
  dep-graph-guard:
    name: Dependency Graph Expansion Guard
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.deps == 'true'
    env:
      # Maximum number of *new* crate names allowed in a single PR.
      # Raise this intentionally when a large dependency addition is approved.
      DEP_GROWTH_LIMIT: "10"
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count dependencies on PR head
        id: head
        shell: bash
        run: |
          set -euo pipefail
          HEAD_COUNT=$(grep -c '^name = ' Cargo.lock || true)
          echo "count=${HEAD_COUNT}" >> "$GITHUB_OUTPUT"
          echo "PR head crate count: ${HEAD_COUNT}"

      - name: Checkout base branch (main)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git show "${{ github.event.pull_request.base.sha }}:Cargo.lock" > /tmp/Cargo.lock.base 2>/dev/null \
            || cp Cargo.lock /tmp/Cargo.lock.base

      - name: Count dependencies on base branch
        if: github.event_name == 'pull_request'
        id: base
        shell: bash
        run: |
          set -euo pipefail
          BASE_COUNT=$(grep -c '^name = ' /tmp/Cargo.lock.base || true)
          echo "count=${BASE_COUNT}" >> "$GITHUB_OUTPUT"
          echo "Base branch crate count: ${BASE_COUNT}"

      - name: Check growth against limit
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          HEAD=${{ steps.head.outputs.count }}
          BASE=${{ steps.base.outputs.count }}
          GROWTH=$(( HEAD - BASE ))
          LIMIT=${DEP_GROWTH_LIMIT}

          echo ""
          echo "Dependency graph summary"
          echo "  Base (main):  ${BASE} crates"
          echo "  PR head:      ${HEAD} crates"
          echo "  Growth:       ${GROWTH} crates (limit: ${LIMIT})"
          echo ""

          if [[ ${GROWTH} -gt ${LIMIT} ]]; then
            echo "::error::Dependency count grew by ${GROWTH} (limit ${LIMIT})."
            echo "  If this growth is intentional, update DEP_GROWTH_LIMIT in ci.yml"
            echo "  and add a comment to the PR explaining the new dependencies."
            exit 1
          fi

          if [[ ${GROWTH} -gt 0 ]]; then
            echo "::notice::Dependency count increased by ${GROWTH} within the allowed limit of ${LIMIT}."
          else
            echo "::notice::No new transitive dependencies introduced."
          fi

      - name: Summarise baseline (main push only)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          COUNT=${{ steps.head.outputs.count }}
          echo "## Dependency baseline" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total crates in Cargo.lock | \`${COUNT}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This is the new baseline for the dependency guard. No action needed." >> "$GITHUB_STEP_SUMMARY"
