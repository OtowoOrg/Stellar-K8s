# kind cluster for validating the Horizon HA database blueprint.
# 3 worker nodes host one Patroni member each (required anti-affinity), so pausing a
# single node simulates losing or partitioning exactly one database member.
# Stateless components (PgBouncer, Horizon, probes) run on the control-plane node,
# so partitioning a database node never takes the client path down with it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: horizon-ha
nodes:
  - role: control-plane
    labels:
      stellar.org/pool: apps
  - role: worker
    labels:
      stellar.org/pool: db
  - role: worker
    labels:
      stellar.org/pool: db
  - role: worker
    labels:
      stellar.org/pool: db
