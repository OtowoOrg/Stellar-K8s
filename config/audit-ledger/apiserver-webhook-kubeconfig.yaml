# kube-apiserver flags (control plane, outside the cluster's own workloads):
#   --audit-policy-file=/etc/kubernetes/audit/audit-policy.yaml
#   --audit-webhook-config-file=/etc/kubernetes/audit/webhook-kubeconfig.yaml
#   --audit-webhook-mode=batch
#   --audit-webhook-batch-max-size=400
#   --audit-webhook-batch-max-wait=5s
#   --audit-webhook-batch-throttle-enable=true
#   --audit-webhook-initial-backoff=1s
#
# `batch` mode is asynchronous: apiserver request latency does not wait for the sink,
# which is how the < 2% throughput-overhead target is met. Use `blocking` only if
# you require that no request completes without its audit event being durable.
apiVersion: v1
kind: Config
clusters:
  - name: audit-sink
    cluster:
      server: https://stellar-audit-sink.stellar-audit.svc:8443/audit
      certificate-authority: /etc/kubernetes/audit/sink-ca.crt
users:
  - name: apiserver
    user:
      tokenFile: /etc/kubernetes/audit/sink-token
contexts:
  - name: default
    context:
      cluster: audit-sink
      user: apiserver
current-context: default
