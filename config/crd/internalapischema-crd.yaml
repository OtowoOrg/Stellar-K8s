apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: internalapischemas.stellar.org
spec:
  group: stellar.org
  names:
    kind: InternalApiSchema
    plural: internalapischemas
    shortNames: [iaschema]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [subject, schemaVersion, registryPath]
              properties:
                subject: {type: string, minLength: 1}
                schemaVersion: {type: integer, minimum: 1}
                registryPath: {type: string, minLength: 1}
                enforceCompatibility: {type: boolean, default: true}
                consumers:
                  type: array
                  items:
                    type: object
                    required: [name, clientReference]
                    properties:
                      name: {type: string, minLength: 1}
                      clientReference: {type: string, minLength: 1}
            status:
              type: object
              properties:
                phase: {type: string, enum: [Pending, Verified, Rejected]}
                compatibilityVerified: {type: boolean}
                impactReport: {type: string}
