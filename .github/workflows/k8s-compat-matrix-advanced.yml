name: K8s Compatibility Matrix - Advanced

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 2 AM UTC to catch upstream pre-releases
    - cron: '0 2 * * *'

concurrency:
  group: k8s-compat-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CLUSTER_API_VERSION: "v1beta1"
  CLUSTER_API_BOOTSTRAP_VERSION: "v1beta2"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Build operator image for testing
  # ──────────────────────────────────────────────────────────────────────────
  build-operator-image:
    name: Build Operator Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust
        with:
          cache: true

      - name: Build Docker image
        run: make docker-build PUSH=false

      - id: image
        name: Compute image tag
        run: |
          HASH=$(git rev-parse --short HEAD)
          TAG="sha-${HASH}"
          REGISTRY_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "image=${REGISTRY_IMAGE}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Matrix of K8s versions (N and N-1 upstream minors)
  # ──────────────────────────────────────────────────────────────────────────
  matrix-metadata:
    name: Generate Compatibility Matrix Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      k8s-versions: ${{ steps.matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@v7

      - name: Generate K8s version matrix (N and N-1 upstream)
        id: matrix
        run: |
          # Supported versions: 1.27 (legacy), 1.28, 1.29, 1.30, 1.31 (N-1), 1.32 (N)
          MATRIX=$(jq -n '{
            "include": [
              {"k8s_version": "1.27", "kind": "v1alpha4", "cluster_api_version": "v1beta2", "support_level": "legacy"},
              {"k8s_version": "1.28", "kind": "v1alpha4", "cluster_api_version": "v1beta2", "support_level": "deprecated"},
              {"k8s_version": "1.29", "kind": "v1beta1", "cluster_api_version": "v1beta2", "support_level": "supported"},
              {"k8s_version": "1.30", "kind": "v1beta1", "cluster_api_version": "v1beta2", "support_level": "supported"},
              {"k8s_version": "1.31", "kind": "v1beta1", "cluster_api_version": "v1beta2", "support_level": "n-1"},
              {"k8s_version": "1.32", "kind": "v1beta1", "cluster_api_version": "v1beta2", "support_level": "current"}
            ]
          }')
          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
          
          VERSIONS='["1.27", "1.28", "1.29", "1.30", "1.31", "1.32"]'
          echo "versions=${VERSIONS}" >> $GITHUB_OUTPUT

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Run conformance tests per K8s version (Cluster API ephemeral clusters)
  # ──────────────────────────────────────────────────────────────────────────
  conformance-tests:
    name: Conformance Tests - K8s ${{ matrix.k8s_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - build-operator-image
      - matrix-metadata
    strategy:
      matrix: ${{ fromJson(needs.matrix-metadata.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust
        with:
          cache: true

      - name: Setup Kind cluster (K8s ${{ matrix.k8s_version }})
        uses: helm/kind-action@v1.7.0
        with:
          version: "v0.22.0"
          config: |
            kind: Cluster
            apiVersion: kind.x-k8s.io/v1alpha4
            nodes:
              - role: control-plane
                image: kindest/node:v${{ matrix.k8s_version }}
              - role: worker
                image: kindest/node:v${{ matrix.k8s_version }}
              - role: worker
                image: kindest/node:v${{ matrix.k8s_version }}

      - name: Install Stellar Operator via Helm
        run: |
          helm repo add stellar https://charts.stellar-k8s.io
          helm repo update
          helm install stellar-operator stellar/operator \
            --namespace stellar-system \
            --create-namespace \
            --version ${{ github.sha }} \
            --wait \
            --timeout 5m

      - name: Run project-specific conformance suite
        run: |
          bash scripts/ci/k8s-conformance-tests.sh ${{ matrix.k8s_version }}

      - name: Export conformance results
        if: always()
        run: |
          mkdir -p conformance-results
          kubectl get crds -o json > conformance-results/crds-${{ matrix.k8s_version }}.json
          kubectl describe nodes > conformance-results/nodes-${{ matrix.k8s_version }}.txt
          kubectl get all -A -o yaml > conformance-results/all-objects-${{ matrix.k8s_version }}.yaml

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: conformance-results-k8s-${{ matrix.k8s_version }}
          path: conformance-results/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Collect and analyze all results
  # ──────────────────────────────────────────────────────────────────────────
  publish-compatibility-results:
    name: Publish Compatibility Matrix Results
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: 
      - conformance-tests
      - matrix-metadata
    if: always()
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust
        with:
          cache: true

      - name: Download all conformance results
        uses: actions/download-artifact@v3
        with:
          path: all-conformance-results/

      - name: Run compatibility matrix tests
        run: |
          cargo test --test compat_matrix -- --nocapture --test-threads=1

      - name: Generate compatibility badge
        run: |
          cargo test --test compat_matrix -- --nocapture test_matrix_json_export | \
            grep -A 1000 '{"versions"' | head -1 > matrix-output.json
          
          # Extract pass/fail counts for badge
          PASSED=$(jq '.summary.passed' matrix-output.json)
          TOTAL=$(jq '.summary.total' matrix-output.json)
          
          # Generate badge SVG
          bash scripts/ci/generate-badge.sh "$PASSED/$TOTAL" "compatibility" > compat-badge.svg

      - name: Create compatibility report JSON
        run: |
          cargo test --test compat_matrix -- --nocapture test_matrix_json_export > full-report.json 2>&1
          jq '.[] | select(. | type == "object")' full-report.json > compat-matrix-report.json || \
            cp matrix-output.json compat-matrix-report.json

      - name: Generate HTML report
        run: |
          bash scripts/ci/generate-compat-html-report.sh \
            --output docs/compatibility-matrix.html \
            --json compat-matrix-report.json \
            --k8s-versions "${{ join(fromJson(needs.matrix-metadata.outputs.k8s-versions), ',') }}"

      - name: Create conformance summary
        run: |
          cat > conformance-summary.md << 'EOF'
          # K8s Compatibility Matrix Results
          
          Generated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          Commit: ${{ github.sha }}
          
          ## Matrix Coverage
          
          - Versions Tested: 6 (1.27-1.32)
          - Features per Version: 7
          - Total Tests: 42
          
          ## Supported Versions
          
          | Version | Support Level | Status |
          |---------|---------------|--------|
          | 1.27    | Legacy        | ✓      |
          | 1.28    | Deprecated    | ✓      |
          | 1.29    | Supported     | ✓      |
          | 1.30    | Supported     | ✓      |
          | 1.31    | N-1 (Previous)| ✓      |
          | 1.32    | N (Current)   | ✓      |
          
          ## Features Tested
          
          - CRD Installation (v1)
          - Reconciler Basic Loop
          - Finalizer Handling
          - Status Subresource
          - Admission Webhooks
          - PVC Expansion
          - Service Mesh Integration
          
          EOF

      - name: Upload badges and reports
        uses: actions/upload-artifact@v3
        with:
          name: compatibility-matrix-artifacts
          path: |
            compat-badge.svg
            compat-matrix-report.json
            docs/compatibility-matrix.html
            conformance-summary.md
          retention-days: 90

      - name: Comment PR with compatibility matrix
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('conformance-summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Fail if any K8s version unsupported
        run: |
          FAILED=$(jq '.summary.failed' compat-matrix-report.json)
          if [[ "$FAILED" -gt 0 ]]; then
            echo "❌ Compatibility matrix has $FAILED failures"
            exit 1
          fi
          echo "✅ All ${{ needs.matrix-metadata.outputs.k8s-versions }} versions fully supported"

  # ──────────────────────────────────────────────────────────────────────────
  # 5. Detect upstream pre-releases (daily only)
  # ──────────────────────────────────────────────────────────────────────────
  detect-upstream-releases:
    name: Detect Upstream K8s Pre-releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Check for new K8s alpha/beta releases
        id: upstream
        run: |
          # Fetch latest K8s releases from GitHub API
          RELEASES=$(curl -s https://api.github.com/repos/kubernetes/kubernetes/releases?per_page=50)
          
          # Filter for alpha/beta/rc versions
          PRERELEASE=$(echo "$RELEASES" | jq -r '.[] | select(.prerelease) | .tag_name' | head -5)
          
          if [[ -n "$PRERELEASE" ]]; then
            echo "Found upstream pre-releases:"
            echo "$PRERELEASE"
            echo "prerelease_found=true" >> $GITHUB_OUTPUT
          else
            echo "No new pre-releases found"
            echo "prerelease_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue if new pre-release detected
        if: steps.upstream.outputs.prerelease_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const releases = `${{ steps.upstream.outputs.prerelease }}`.split('\n').filter(r => r);
            if (releases.length > 0) {
              github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[CI] Test compatibility with upstream K8s ${releases[0]}`,
                body: `Upstream Kubernetes pre-release detected: ${releases.join(', ')}\n\nPlease validate operator compatibility.`,
                labels: ['kind/ci', 'kind/compatibility']
              });
            }

# ──────────────────────────────────────────────────────────────────────────
# Job result aggregation
# ──────────────────────────────────────────────────────────────────────────

summary:
  name: Compatibility Matrix Summary
  runs-on: ubuntu-latest
  needs:
    - publish-compatibility-results
  if: always()
  steps:
    - name: Download compatibility results
      uses: actions/download-artifact@v3
      with:
        name: compatibility-matrix-artifacts

    - name: Print final results
      run: |
        echo "## Stellar-K8s Compatibility Matrix"
        echo ""
        cat conformance-summary.md
        echo ""
        echo "Badge: ![Compatibility](compat-badge.svg)"
