[package]
name = "kubectl-stellar-cli"
version = "0.1.0"
edition = "2021"
authors = ["Stellar K8s Contributors"]
description = "kubectl plugin for Stellar validator health diagnostics"
license = "Apache-2.0"
repository = "https://github.com/stellar/stellar-k8s"

[[bin]]name = "kubectl-stellar"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Kubernetes client
kube = { version = "0.94", features = ["client", "config", "ws", "runtime"] }
kube-runtime = { version = "0.94" }
k8s-openapi = { version = "0.22", default-features = false, features = ["v1_30"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# CLI argument parsing
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"

# HTTP client for stellar-core /info endpoint
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Terminal UI
colorey = "0.1"
comfy-table = "7.2.2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Tunneling for port-forward
kube = { version = "0.94", features = ["client", "config", "ws", "runtime"] }
tokio-tunnel = "0.1"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
