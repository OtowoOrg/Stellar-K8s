name: Supply-Chain Provenance Attestation

# Epic #1477 - End-to-End Supply-Chain Provenance Attestation Pipeline
#
# Implements the full provenance pipeline for all Stellar-K8s build artefacts.
# Jobs: build -> sbom -> attest (SLSA v1.0) -> sign (Cosign keyless) -> verify
#
# Outputs published to the OCI Referrer Graph:
#   application/vnd.in-toto+json      (SLSA provenance)
#   application/vnd.cyclonedx+json    (SBOM)
#   application/vnd.dev.cosign.simplesigning.v1+json (Cosign signature)
#
# External dependencies:
#   sigstore/cosign-installer@v3, actions/attest-build-provenance@v4,
#   anchore/sbom-action@v0, GitHub OIDC (id-token: write), Rekor transparency log.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile*"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/supply-chain-provenance.yml"
      - ".github/actions/sign-image/**"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile*"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
  workflow_dispatch:
    inputs:
      image_ref:
        description: "OCI image reference to verify (leave blank to build fresh)"
        required: false
        default: ""

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  REQUIRED_SLSA_LEVEL: L2

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image-ref: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest || steps.retag.outputs.digest }}
      image-name: ${{ steps.setup-docker.outputs.image-name }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Docker and Login
        id: setup-docker
        uses: ./.github/actions/setup-docker
        with:
          registry: ${{ env.REGISTRY }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.setup-docker.outputs.image-name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
      - name: Reuse sha image (if available)
        id: retag
        continue-on-error: true
        run: |
          SHA_TAG="${{ env.REGISTRY }}/${{ steps.setup-docker.outputs.image-name }}:sha-${{ github.sha }}"
          if docker buildx imagetools inspect "$SHA_TAG" > /dev/null 2>&1; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
            DIGEST=$(docker buildx imagetools inspect "$SHA_TAG" \
              --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || echo "")
            echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          else
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push (fallback)
        if: steps.retag.outputs.reused != 'true'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Generate container SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ needs.build.outputs.image-name }}@${{ needs.build.outputs.digest }}
          artifact-name: sbom-${{ github.sha }}.cyclonedx.json
          format: cyclonedx-json
      - name: Upload SBOM artefact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom-${{ github.sha }}.cyclonedx.json
          retention-days: 90

  attest:
    name: Attest SLSA Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: github.event_name != 'pull_request'
    outputs:
      attestation-id: ${{ steps.attest.outputs.attestation-id }}
    steps:
      - uses: actions/checkout@v7
      - name: Attest container image provenance (SLSA v1.0)
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ needs.build.outputs.image-name }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true

  sign:
    name: Sign Image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, attest]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Sign image with Cosign (keyless)
        uses: ./.github/actions/sign-image
        with:
          image: ${{ env.REGISTRY }}/${{ needs.build.outputs.image-name }}
          digest: ${{ needs.build.outputs.digest }}

  verify:
    name: Verify Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, attest, sign]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Setup Docker and Login
        uses: ./.github/actions/setup-docker
        with:
          registry: ${{ env.REGISTRY }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"
      - name: Verify GitHub-hosted attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IMAGE="oci://${{ env.REGISTRY }}/${{ needs.build.outputs.image-name }}@${{ needs.build.outputs.digest }}"
          gh attestation verify "$IMAGE" --repo "${{ github.repository }}"
          echo "GitHub attestation verified"
      - name: Verify Cosign signature via Rekor
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ needs.build.outputs.image-name }}@${{ needs.build.outputs.digest }}"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE"
          echo "Cosign signature verified"