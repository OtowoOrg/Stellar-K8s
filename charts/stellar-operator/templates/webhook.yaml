{{- if .Values.webhook.enabled }}
---
# Namespace for the webhook
apiVersion: v1
kind: Namespace
metadata:
  name: stellar-webhook
  labels:
    app.kubernetes.io/name: stellar-webhook
    app.kubernetes.io/component: admission-webhook
---
# ServiceAccount for the webhook
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stellar-webhook
  namespace: stellar-webhook
  labels:
    app.kubernetes.io/name: stellar-webhook
---
# ClusterRole for the webhook
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stellar-webhook
  labels:
    app.kubernetes.io/name: stellar-webhook
rules:
  # Read StellarNodes for validation context
  - apiGroups: ["stellar.io"]
    resources: ["stellarnodes"]
    verbs: ["get", "list", "watch"]
  # Read ConfigMaps and Secrets for plugin configuration
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stellar-webhook
  labels:
    app.kubernetes.io/name: stellar-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stellar-webhook
subjects:
  - kind: ServiceAccount
    name: stellar-webhook
    namespace: stellar-webhook
---
# Deployment for the webhook server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stellar-webhook
  namespace: stellar-webhook
  labels:
    app.kubernetes.io/name: stellar-webhook
    app.kubernetes.io/component: admission-webhook
spec:
  replicas: {{ .Values.webhook.replicaCount | default 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: stellar-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stellar-webhook
        app.kubernetes.io/component: admission-webhook
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.webhook.metricsPort | default 9090 | quote }}
    spec:
      serviceAccountName: stellar-webhook
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: '{{ if .Values.image.digest }}{{ .Values.image.repository }}@{{ .Values.image.digest }}{{ else }}{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}{{ end }}'
          imagePullPolicy: '{{ .Values.image.pullPolicy }}'
          args:
            - "--bind=0.0.0.0:{{ .Values.webhook.port | default 8443 }}"
            - "--cert-path=/certs/tls.crt"
            - "--key-path=/certs/tls.key"
            - "--log-format=json"
          ports:
            - name: https
              containerPort: {{ .Values.webhook.port | default 8443 }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.webhook.metricsPort | default 9090 }}
              protocol: TCP
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.webhook.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            {{- if .Values.webhook.certManager.enabled }}
            httpGet:
              path: /ready
              port: cert-health
            {{- else }}
            httpGet:
              path: /ready
              port: https
              scheme: HTTPS
            {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: plugins
              mountPath: /plugins
              readOnly: true
        {{- if .Values.webhook.certManager.enabled }}
        # Readiness is gated by an offline verifier before the kubelet or
        # apiserver can observe an invalid certificate/key pair.
        - name: cert-health
          image: '{{ if .Values.image.digest }}{{ .Values.image.repository }}@{{ .Values.image.digest }}{{ else }}{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}{{ end }}'
          imagePullPolicy: '{{ .Values.image.pullPolicy }}'
          command:
            - /stellar-cert-health
          args:
            - --cert-path=/certs/tls.crt
            - --key-path=/certs/tls.key
            - --ca-path=/certs/ca.crt
            - --dns-name=stellar-webhook.stellar-webhook.svc
            - --bind=0.0.0.0:9443
            - --reload-interval-secs=5
          ports:
            - name: cert-health
              containerPort: 9443
              protocol: TCP
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.webhook.certHealth.resources | nindent 12 }}
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
        {{- end }}
      volumes:
        - name: certs
          secret:
            secretName: stellar-webhook-certs
        - name: plugins
          configMap:
            name: stellar-webhook-plugins
            optional: true
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: stellar-webhook
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: stellar-webhook
---
# Service for the webhook
apiVersion: v1
kind: Service
metadata:
  name: stellar-webhook
  namespace: stellar-webhook
  labels:
    app.kubernetes.io/name: stellar-webhook
spec:
  type: ClusterIP
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
    - name: metrics
      port: {{ .Values.webhook.metricsPort | default 9090 }}
      targetPort: metrics
      protocol: TCP
    {{- if .Values.webhook.certManager.enabled }}
    - name: cert-health
      port: 9443
      targetPort: cert-health
      protocol: TCP
    {{- end }}
  selector:
    app.kubernetes.io/name: stellar-webhook
---
# ValidatingWebhookConfiguration
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: stellar-webhook
  labels:
    app.kubernetes.io/name: stellar-webhook
  {{- if .Values.webhook.certManager.enabled }}
  annotations:
    # cainjector distributes the CA to every apiserver in the cluster.
    cert-manager.io/inject-ca-from: stellar-webhook/stellar-webhook-ca
  {{- end }}
webhooks:
  - name: stellarnode.stellar.io
    clientConfig:
      service:
        name: stellar-webhook
        namespace: stellar-webhook
        path: /validate
        port: 443
      # caBundle is populated by cert-manager cainjector. Admission remains
      # fail-closed when the bundle or serving identity cannot be verified.
    rules:
      - apiGroups: ["stellar.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["stellarnodes"]
        scope: Namespaced
    admissionReviewVersions: ["v1", "v1beta1"]
    sideEffects: None
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds | default 10 }}
    # Certificate verification, endpoint, and timeout errors block admission.
    failurePolicy: Fail
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        # Skip kube-system and stellar-webhook namespaces
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - stellar-webhook
{{- if .Values.webhook.certManager.enabled }}
---
# A namespaced bootstrap issuer avoids collisions with other applications.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: stellar-webhook-selfsigned
  namespace: stellar-webhook
  labels:
    app.kubernetes.io/name: stellar-webhook
    app.kubernetes.io/component: admission-webhook-tls
spec:
  selfSigned: {}
---
# The CA is independently renewed by cert-manager. cainjector distributes its
# ca.crt to every apiserver through the inject-ca-from annotation above.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: stellar-webhook-ca
  namespace: stellar-webhook
  labels:
    app.kubernetes.io/name: stellar-webhook
    app.kubernetes.io/component: admission-webhook-ca
spec:
  secretName: stellar-webhook-ca
  commonName: stellar-webhook-ca
  isCA: true
  duration: {{ .Values.webhook.certManager.caDuration | default "8760h" }}
  renewBefore: {{ .Values.webhook.certManager.caRenewBefore | default "2160h" }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: stellar-webhook-selfsigned
    kind: Issuer
    group: cert-manager.io
---
# CA-backed issuer used for continuously renewed serving identities.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: stellar-webhook-ca
  namespace: stellar-webhook
  labels:
    app.kubernetes.io/name: stellar-webhook
    app.kubernetes.io/component: admission-webhook-tls
spec:
  ca:
    secretName: stellar-webhook-ca
---
# Every cert-manager renewal atomically updates the mounted Secret. The server
# reloads it and the cert-health sidecar gates readiness during the transition.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: stellar-webhook-cert
  namespace: stellar-webhook
  labels:
    app.kubernetes.io/name: stellar-webhook
    app.kubernetes.io/component: admission-webhook-tls
spec:
  secretName: stellar-webhook-certs
  commonName: stellar-webhook.stellar-webhook.svc
  duration: {{ .Values.webhook.certManager.duration | default "2160h" }}
  renewBefore: {{ .Values.webhook.certManager.renewBefore | default "720h" }}
  dnsNames:
    - stellar-webhook
    - stellar-webhook.stellar-webhook
    - stellar-webhook.stellar-webhook.svc
    - stellar-webhook.stellar-webhook.svc.cluster.local
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    name: stellar-webhook-ca
    kind: Issuer
    group: cert-manager.io
{{- end }}
---
# ConfigMap for plugin configuration (optional)
apiVersion: v1
kind: ConfigMap
metadata:
  name: stellar-webhook-plugins
  namespace: stellar-webhook
  labels:
    app.kubernetes.io/name: stellar-webhook
data:
  # Plugin configurations can be added here
  # Each entry should be a JSON file with the plugin config
  plugins.json: |
    {
      "plugins": []
    }
---
# PodDisruptionBudget for high availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stellar-webhook
  namespace: stellar-webhook
  labels:
    app.kubernetes.io/name: stellar-webhook
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stellar-webhook
{{- end }}
