apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base resources shared across all environments.
# Overlays must patch network, version, storage, and resource values.
resources:
  - namespace.yaml
  - validator.yaml
  - soroban-rpc.yaml
  - horizon.yaml

commonLabels:
  app.kubernetes.io/managed-by: argocd
  app.kubernetes.io/part-of: stellar-k8s
