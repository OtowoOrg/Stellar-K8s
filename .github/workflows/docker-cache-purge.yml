name: Docker Cache Purge

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PURGE to confirm removing unused Docker build cache layers"
        required: true
        default: ""
        type: string

permissions:
  contents: read

jobs:
  purge-build-cache:
    name: Purge unused Docker build cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify confirmation prompt
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "PURGE" ]]; then
            echo "Refusing to purge: confirmation must be exactly PURGE"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Snapshot local images
        shell: bash
        run: |
          set -euo pipefail
          docker image ls --format '{{.Repository}}:{{.Tag}}@{{.ID}}' | sort > /tmp/images-before.txt

      - name: Purge unused build cache layers
        shell: bash
        run: |
          set -euo pipefail
          docker buildx prune --all --force

      - name: Verify essential images remain
        shell: bash
        run: |
          set -euo pipefail
          docker image ls --format '{{.Repository}}:{{.Tag}}@{{.ID}}' | sort > /tmp/images-after.txt
          diff -u /tmp/images-before.txt /tmp/images-after.txt
          echo "Docker build cache purged without removing local images"
