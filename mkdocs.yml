    - Operator REST API:
      - api/index.md
      - OpenAPI Specification: api/openapi.yaml
      - API Versioning: api/versioning.md
      - Webhook API: api/webhook.md
      - Metrics API: api/metrics.md
      - Error Codes: api/error-codes.md
      - Client Libraries: api/client-libraries.md
  - Security:
    - Security Compliance Guide: security/compliance-guide.md
    - Container Image Security: container-image-security.md
